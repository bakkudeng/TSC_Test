<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TSC 실전 모의고사 10회</title>
<meta name="description" content="TSC 제2~6부분 모의고사 10회분 · 문제별 듣기, 병음, 실전 타이머">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<style>
/* Layout: 한 페이지 문제집 — 상단 고정 부분 이동/병음 토글, 부분별 문제 카드(그림 설명 · 병음 한자 · 듣기/타이머) */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#16232b; --muted:#5b6b74; --line:#d3dde2;
  --accent:#0d6f6a; --accent-soft:#dcefed; --prep:#b26a00; --prep-soft:#fbeed8; --ans:#c0392b; --ans-soft:#f9e1de;
  --pic:#f6f8f9; --pic-line:#9fb2bb; --py:#0d6f6a;
  --f-ko:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#172228; --ink:#e4ecef; --muted:#93a5ad; --line:#2a3a42;
  --accent:#4fb8b0; --accent-soft:#163a38; --prep:#e5a43f; --prep-soft:#3a2c14; --ans:#ef7a6c; --ans-soft:#3d1f1b;
  --pic:#1c2a31; --pic-line:#4b626c; --py:#6cc9c1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#172228; --ink:#e4ecef; --muted:#93a5ad; --line:#2a3a42;
  --accent:#4fb8b0; --accent-soft:#163a38; --prep:#e5a43f; --prep-soft:#3a2c14; --ans:#ef7a6c; --ans-soft:#3d1f1b;
  --pic:#1c2a31; --pic-line:#4b626c; --py:#6cc9c1; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body{font-family:var(--f-ko);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.zh{font-family:var(--f-zh)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;min-height:40px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* sticky top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.top-in{max-width:720px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav .jump:hover{border-color:var(--accent)}
.nav a{flex:none;text-decoration:none;color:var(--ink);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.nav a:hover{border-color:var(--accent)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{width:18px;height:18px;accent-color:var(--accent)}

.hero{padding-top:20px}
.hero h1{font-size:24px}
.hero p{margin:6px 0 0;max-width:62ch}

/* part section */
.part{display:flex;flex-direction:column;gap:12px;scroll-margin-top:110px}
.part-head{display:flex;flex-direction:column;gap:2px;padding-top:8px}
.part-head h2{font-size:19px}
.part-head .meta{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qnum{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.picture{background:var(--pic);border:2px dashed var(--pic-line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.picture .lbl{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.picture .desc{font-size:14px}
.picture .tag{font-size:13px;color:var(--muted)}

/* pinyin ruby */
.zhline{font-family:var(--f-zh);font-size:21px;line-height:2.3;font-weight:500;word-break:break-all}
.zhline.small{font-size:17px;font-weight:400;line-height:2.2}
ruby{ruby-position:over}
rt{font-family:var(--f-ko);font-size:.52em;color:var(--py);font-weight:400;letter-spacing:0}
.nopy rt{visibility:hidden}
.nopy.zhline{line-height:1.7}
.nopy rt{display:none}
.ko{font-size:14px;color:var(--muted)}

/* timer */
.timer{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbox{border-radius:10px;padding:8px 12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tbox .t-lbl{font-size:12px;font-weight:500;display:flex;justify-content:space-between}
.tbox .t-val{font-size:22px;font-weight:600;line-height:1}
.track{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0%}
.tbox.prep.on{background:var(--prep-soft);border-color:var(--prep)}
.tbox.prep .fill{background:var(--prep)}
.tbox.ans.on{background:var(--ans-soft);border-color:var(--ans)}
.tbox.ans .fill{background:var(--ans)}
.status{font-weight:700;font-size:14px}
.status.listen{color:var(--accent)} .status.prep{color:var(--prep)} .status.ans{color:var(--ans)}

details{border-radius:10px;background:var(--pic);padding:10px 12px}
summary{cursor:pointer;font-weight:500;font-size:14px}
.model{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.chip{font-size:13px;padding:5px 12px;min-height:34px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin:0}
.warn{font-size:13px;color:var(--prep)}

.qhidden{font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.card button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.rounds{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rtab{flex:none;text-decoration:none;color:var(--ink);font-family:var(--f-num);font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:52px}
.rtab small{font-size:10px;font-weight:500;color:var(--muted)}
.rtab.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.rtab.on small{color:var(--surface)}
.navbtn{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:var(--surface)}
.navbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.nav .jump{flex:none;font-size:13px;border-radius:999px;padding:5px 12px;min-height:32px;white-space:nowrap}
.rtab{cursor:pointer;background:var(--surface)}
.navbtn{font:inherit}
.toggles{align-items:center}
.speed{display:flex;gap:8px;align-items:center;min-width:0}
.speed>span{white-space:nowrap}
.rates{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.rate{flex:none;font-family:var(--f-num);font-size:12px;padding:3px 8px;min-height:30px;border-radius:6px}
.rate[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="top"><div class="top-in">
  <nav class="rounds" id="rounds" aria-label="회차 선택"></nav>
  <nav class="nav" id="nav" aria-label="부분 이동"></nav>
  <div class="toggles"><label><input type="checkbox" id="t_ko"> 한국어 해석 보기</label>
  <div class="speed" role="group" aria-label="음성 속도"><span>음성 속도</span><div id="rates" class="rates"></div></div></div>
</div></div>
<div class="wrap" id="app"></div>
<script>
const META=[{"no":2,"zh":"看图回答","ko":"그림 보고 답하기","prep":3,"ans":6,"guide":["그림을 보고 질문에 짧고 정확하게 답합니다.","완전한 문장으로 답하면 좋습니다. (예: 猫在桌子上。)"]},{"no":3,"zh":"快速回答","ko":"빠르게 답하기","prep":2,"ans":15,"guide":["일상 대화 속 상대방의 말에 바로 이어서 답합니다.","한 문장 + 이유나 덧붙임 한 문장, 2~3문장이 적당합니다."]},{"no":4,"zh":"简短回答","ko":"간단하게 답하기","prep":15,"ans":25,"guide":["나의 생활·경험·습관에 대해 구체적으로 답합니다.","결론 → 이유 → 예시 순서로 4~5문장을 목표로 하세요."]},{"no":5,"zh":"拓展回答","ko":"논리적으로 답하기(의견 제시)","prep":30,"ans":50,"guide":["사회·생활 이슈에 대한 내 의견을 논리적으로 말합니다.","입장 → 이유 2가지 → 마무리 정리 구조로 6~8문장을 목표로 하세요."]},{"no":6,"zh":"情景应对","ko":"상황에 맞게 답하기","prep":30,"ans":40,"guide":["그림과 상황 설명을 듣고, 그 상황 속 상대에게 직접 말하듯 답합니다.","인사·상황 설명 → 요청/제안 → 마무리 인사 순서로 말하세요."]}];
const R={"1":{"p2":[["책상 위에 고양이 한 마리가 앉아 있고, 책상 아래에는 가방이 놓여 있다. (유형: 위치 묻기)","猫在哪儿？","고양이는 어디에 있나요?","猫在桌子上。","고양이는 책상 위에 있어요."],["과일 가게 진열대. 사과 가격표 ‘8.5元/斤’, 바나나 가격표 ‘6元/斤’. (유형: 가격·숫자)","苹果一斤多少钱？","사과는 한 근에 얼마예요?","苹果一斤八块五。","사과는 한 근에 8.5위안이에요."],["실내 수영장에서 한 남자가 수영을 하고 있다. (유형: 동작)","男的在做什么？","남자는 무엇을 하고 있나요?","他在游泳。","그는 수영하고 있어요."],["두 사람이 나란히 서 있다. 왼쪽 ‘小王 175cm’, 오른쪽 ‘小李 168cm’. (유형: 비교문)","小王比小李高多少？","샤오왕은 샤오리보다 얼마나 더 큰가요?","小王比小李高七厘米。","샤오왕이 샤오리보다 7cm 커요."]],"p3":[["창밖으로 비가 내리는 카페. 두 친구가 마주 앉아 이야기하고 있다.","你喜欢下雨的天气吗？","비 오는 날씨를 좋아하세요?","我不太喜欢下雨天。下雨的时候出门很不方便，路上还经常堵车。","비 오는 날은 별로예요. 외출이 불편하고 길도 자주 막혀요."],["사무실. 동료가 영화 포스터가 띄워진 휴대폰 화면을 보여주며 말을 건다.","这个周末我们一起去看电影，怎么样？","이번 주말에 같이 영화 보러 갈래요?","好啊！我正好周六下午有空。我们看完电影再一起吃饭吧。","좋아요! 마침 토요일 오후에 시간이 있어요. 영화 보고 같이 밥도 먹어요."],["아침 출근길 엘리베이터. 피곤해 보이는 나에게 동료가 묻는다.","你昨天晚上几点睡的？","어젯밤 몇 시에 잤어요?","我昨天晚上一点多才睡。因为要准备今天的会议资料，所以睡得很晚。","새벽 1시 넘어서 잤어요. 오늘 회의 자료를 준비하느라 늦게 잤어요."],["지하철역 입구. 친구가 출근 방법을 묻는다.","你平时怎么去公司？","평소에 회사에 어떻게 가요?","我一般坐地铁去公司，大概要四十分钟。地铁又快又不堵车。","보통 지하철로 가요. 40분쯤 걸리는데, 빠르고 막히지 않아서요."],["식당. 종업원이 메뉴판을 들고 테이블 옆에 서 있다. (내가 손님 역할)","您好，请问您想喝点儿什么？","안녕하세요, 마실 것은 무엇으로 드릴까요?","给我来一杯冰美式吧。另外，再给我一杯水，谢谢。","아이스 아메리카노 한 잔 주세요. 그리고 물도 한 잔 부탁해요."]],"p4":[["","你觉得自己性格上最大的优点是什么？请简单谈谈。","자신의 성격에서 가장 큰 장점은 무엇이라고 생각하나요?","我觉得我最大的优点是很有责任心。不管做什么事情，我都会认真地完成。比如上个月公司有一个很急的项目，我连续加了一个星期的班，最后按时完成了。所以同事们都很信任我。","가장 큰 장점은 책임감이에요. 무슨 일이든 성실하게 끝내요. 지난달 급한 프로젝트 때 일주일 야근해서 기한 안에 끝냈고, 그래서 동료들이 저를 믿어요."],["","请介绍一下你现在住的城市。","지금 살고 있는 도시를 소개해 주세요.","我住在首尔。首尔是韩国的首都，也是一个很热闹的城市。这里交通特别方便，地铁可以去任何地方。另外，首尔有很多好吃的饭店和有名的景点，所以我很喜欢住在这儿。","저는 서울에 살아요. 한국의 수도이고 매우 활기찬 도시예요. 교통이 편리하고 맛집과 명소가 많아서 사는 게 좋아요."],["","如果有朋友来韩国旅游，你会推荐他去哪儿？","친구가 한국에 여행 오면 어디를 추천하겠어요?","我会推荐他去济州岛。济州岛的风景非常美，有大海，还有汉拿山。而且那里的海鲜又新鲜又好吃。从首尔坐飞机只要一个小时，非常方便。","제주도를 추천할 거예요. 바다와 한라산이 있어 경치가 아름답고 해산물도 신선해요. 서울에서 비행기로 1시간이라 편해요."],["","你压力大的时候，一般怎么解压？","스트레스가 많을 때 보통 어떻게 푸나요?","压力大的时候，我一般去运动。我常常下班以后去公园跑步，跑完步出一身汗，心情就会好很多。周末的时候，我也会和朋友们一起爬山。","스트레스가 많으면 운동을 해요. 퇴근 후 공원에서 달리면 기분이 훨씬 나아지고, 주말엔 친구들과 등산도 해요."],["","你理想中的另一半是什么样的人？","이상적인 배우자(연인)는 어떤 사람인가요?","我理想中的另一半是一个温柔、有幽默感的人。我觉得两个人在一起，最重要的是能互相理解。如果他（她）有幽默感，生活会更有意思。","다정하고 유머 감각 있는 사람이요. 함께 지내려면 서로 이해하는 게 가장 중요하고, 유머가 있으면 생활이 더 즐거워요."]],"p5":[["","你认为夫妻两个人都应该上班吗？为什么？","부부가 둘 다 일해야 한다고 생각하나요? 왜죠?","我认为夫妻两个人都应该上班。第一，现在物价越来越高，孩子的教育费用也很贵，只靠一个人的工资很难生活。第二，工作不仅能赚钱，还能让人实现自己的价值，和社会保持联系。当然，两个人都工作会比较累，所以家务应该一起分担。总之，我支持夫妻双方都工作。","둘 다 일해야 한다고 봐요. 첫째, 물가와 교육비가 비싸 한 사람 월급으론 어렵고, 둘째, 일은 자아실현과 사회 연결에도 도움이 돼요. 대신 집안일은 함께 나눠야 해요."],["","你觉得在公司里什么样的人最受欢迎？","회사에서 어떤 사람이 가장 인기가 있다고 생각하나요?","我觉得在公司里最受欢迎的是积极、乐于助人的人。首先，这样的人工作态度好，遇到困难也不会抱怨，能给大家带来正能量。其次，他们愿意帮助同事，团队合作会更顺利。所以，不管能力强不强，性格好、肯帮忙的人在公司里一定很受欢迎。","적극적이고 남을 잘 돕는 사람이요. 태도가 좋아 긍정적인 분위기를 만들고, 동료를 도와 팀워크가 좋아지니까요."],["","有人说孩子应该从小学外语，你怎么看？","아이는 어릴 때부터 외국어를 배워야 한다는 의견, 어떻게 생각하나요?","我同意这个看法。小孩子的模仿能力很强，从小学外语，发音会更标准。而且现在是全球化时代，会外语以后找工作也更有优势。不过，我觉得父母不应该给孩子太大的压力，要让孩子快乐地学习。","동의해요. 아이는 모방 능력이 좋아 발음이 정확해지고, 글로벌 시대라 취업에도 유리해요. 다만 부담을 너무 주지 말고 즐겁게 배우게 해야 해요."],["","你认为网上购物给人们的生活带来了哪些影响？","온라인 쇼핑이 사람들의 생활에 어떤 영향을 주었다고 생각하나요?","我认为网上购物给生活带来了很多好处，也有一些坏处。好处是很方便，在家就能买到各种东西，还能比较价格，节省时间。坏处是看不到实物，有时候收到的东西和照片不一样。另外，因为太方便，很多人容易冲动消费。所以网上购物的时候要理性一点。","장점은 편리하고 가격 비교로 시간을 아끼는 것, 단점은 실물을 못 봐서 사진과 다를 수 있고 충동구매가 쉬운 것이에요. 그래서 이성적으로 사야 해요."]],"p6":[["침대에 누워 체온계를 입에 문 사람이 휴대폰으로 전화를 걸고 있다. 벽시계는 오전 8시. (상대: 팀장(상사))","你今天身体不舒服，不能去上班。请你给上司打电话说明情况，并请一天假。","오늘 몸이 아파 출근을 못 해요. 상사에게 전화해 상황을 설명하고 하루 휴가를 요청하세요.","喂，张经理，您好！我是小金。真不好意思，我昨天晚上开始发烧，今天早上还是很不舒服，所以想请一天假去医院看看。今天的会议资料我已经发到您的邮箱了。有急事的话，您随时给我打电话。给您添麻烦了。","장 팀장님, 김입니다. 어젯밤부터 열이 나서 오늘 하루 병원에 가려고 휴가를 내고 싶어요. 회의 자료는 메일로 보냈고 급한 일은 전화 주세요."],["한여름 기숙사 방. 룸메이트가 에어컨 리모컨을 들고 있고, 나는 담요를 두르고 기침을 하고 있다. (상대: 룸메이트)","天气很热，你的同屋一直开着空调。可是你感冒了，请你跟同屋商量一下。","날이 더워 룸메이트가 계속 에어컨을 켜요. 그런데 당신은 감기에 걸렸어요. 룸메이트와 상의해 보세요.","小李，我跟你商量一件事儿。我这两天感冒了，一吹空调就咳嗽。你看能不能把温度调高一点儿，或者晚上睡觉的时候关上空调，开电风扇？等我感冒好了，你想怎么开都行。谢谢你啊！","샤오리, 상의할 게 있어. 감기 걸려서 에어컨 바람에 기침이 나. 온도를 좀 올리거나 밤엔 끄고 선풍기를 켜면 안 될까? 나으면 마음대로 켜도 돼."],["병원 입원실. 동료가 환자복을 입고 침대에 누워 있고, 나는 꽃다발과 과일 바구니를 들고 병문안을 왔다. (상대: 동료)","你的同事生病了，需要请长假休息。请你安慰一下他。","동료가 아파서 장기 휴가를 내야 해요. 그를 위로해 주세요.","小王，听说你住院了，大家都很担心你。你现在感觉怎么样？你别担心工作的事儿，你的工作我们会帮你做好的。你就安心地休息，按时吃药，多注意身体。等你好了，我们一起去吃好吃的！","샤오왕, 입원했다고 해서 다들 걱정해. 몸은 좀 어때? 일은 우리가 맡을 테니 걱정 말고 푹 쉬어. 다 나으면 맛있는 거 먹으러 가자!"]]},"2":{"p2":[["벽시계가 7시 30분을 가리키고 있다. 창밖은 밝은 아침.","现在几点？","지금 몇 시예요?","现在七点半。","지금 7시 반이에요."],["식탁 위에 컵 세 개와 접시 하나가 놓여 있다.","桌子上有几个杯子？","식탁 위에 컵이 몇 개 있나요?","桌子上有三个杯子。","컵이 세 개 있어요."],["소파에 앉은 여자가 휴대폰을 귀에 대고 통화하고 있다.","女的在干什么？","여자는 무엇을 하고 있나요?","她在打电话。","그녀는 전화하고 있어요."],["가방 두 개. 빨간 가방 가격표 320元, 검은 가방 가격표 280元.","哪个包更贵？","어느 가방이 더 비싸요?","红色的包更贵，比黑色的贵四十块。","빨간 가방이 40위안 더 비싸요."]],"p3":[["중식당. 동료가 마라탕 메뉴를 가리키며 묻는다.","你喜欢吃辣的吗？","매운 거 좋아해요?","我特别喜欢吃辣的，越辣越好。今天就点这个麻辣烫吧！","매운 걸 아주 좋아해요. 오늘 마라탕 시켜요!"],["사무실 복도. 동료가 회의 일정표를 들고 있다.","明天的会议改到下午了，你知道吗？","내일 회의가 오후로 바뀐 거 알아요?","我还不知道呢，谢谢你告诉我。那我上午可以先把报告写完。","몰랐어요, 알려줘서 고마워요. 그럼 오전에 보고서를 먼저 끝낼게요."],["주말 아침 침실. 친구가 전화로 묻는다.","你周末一般几点起床？","주말에 보통 몇 시에 일어나요?","周末我一般睡到九点左右，因为平时上班太累了，想多睡一会儿。","주말엔 9시쯤까지 자요. 평일에 피곤해서 더 자고 싶거든요."],["옷가게 탈의실 앞. 점원이 거울 옆에 서 있다. (내가 손님)","这件外套您穿着怎么样？","이 외투 입어보니 어떠세요?","颜色我挺喜欢的，就是有点儿大。有没有小一号的？","색은 마음에 드는데 좀 커요. 한 치수 작은 거 있어요?"],["점심시간 회사 식당. 새로 온 동료가 묻는다.","你家离公司远吗？","집이 회사에서 멀어요?","不太远，坐公交车二十分钟就到了。早上不堵车的话更快。","별로 안 멀어요. 버스로 20분이면 돼요. 안 막히면 더 빨라요."]],"p4":[["","你平时怎么过周末？","평소 주말을 어떻게 보내나요?","周末我一般上午在家打扫房间、洗衣服，下午去附近的咖啡馆看看书。有时候也会和家人一起去郊外散散心。这样一个周末下来，又能充满精神地开始新的一周。","오전엔 청소와 빨래, 오후엔 카페에서 독서, 가끔 가족과 교외에 나가요. 그러면 새 한 주를 힘차게 시작할 수 있어요."],["","请介绍一下你最好的朋友。","가장 친한 친구를 소개해 주세요.","我最好的朋友叫敏浩，我们是高中同学，认识已经十五年了。他性格开朗，说话很有意思。每次我遇到烦心事，他都会耐心地听我说，给我出主意。","가장 친한 친구는 고등학교 동창 민호예요. 15년 지기이고 밝고 재밌어요. 고민이 있으면 늘 들어주고 조언해줘요."],["","你学汉语多长时间了？学汉语有什么困难？","중국어를 배운 지 얼마나 됐나요? 어려운 점은?","我学汉语快两年了。对我来说，最难的是声调，有时候声调说错了，意思就完全不一样。所以我每天跟着录音练习发音，现在比以前好多了。","곧 2년이 돼요. 성조가 가장 어려워요. 틀리면 뜻이 달라져서 매일 녹음을 따라 연습했고 지금은 많이 나아졌어요."],["","你喜欢在网上看新闻还是看报纸？","인터넷 뉴스와 신문 중 무엇을 더 좋아하나요?","我更喜欢在网上看新闻。用手机随时随地都能看，而且新闻更新得特别快。不过网上的消息有真有假，所以我只看可靠的新闻网站。","인터넷 뉴스요. 언제 어디서나 보고 업데이트도 빨라요. 다만 가짜도 있어서 믿을 만한 사이트만 봐요."],["","你最近买的东西中，最满意的是什么？","최근 산 물건 중 가장 만족스러운 것은?","我最满意的是上个月买的一台空气净化器。最近雾霾很严重，自从用了它，家里的空气清新多了，晚上也睡得更香了。虽然价格有点儿贵，但我觉得很值。","지난달 산 공기청정기예요. 미세먼지가 심한데 쓰고 나서 공기가 맑아지고 잠도 잘 와요. 비싸도 그만한 가치가 있어요."]],"p5":[["","你认为现在的年轻人为什么不想结婚？","요즘 젊은이들은 왜 결혼을 원하지 않는다고 생각하나요?","我认为主要有两个原因。一是经济压力大，房价太高，结婚、养孩子都需要很多钱。二是现在的年轻人更重视个人生活，觉得一个人也能过得很自由、很充实。所以我觉得，如果社会能减轻年轻人的负担，愿意结婚的人会多一些。","첫째 집값 등 경제 부담, 둘째 개인 생활을 중시하는 가치관 때문이에요. 사회가 부담을 덜어주면 결혼하려는 사람이 늘 거예요."],["","你觉得在大城市生活好还是在小城市生活好？","대도시와 소도시 중 어디서 사는 게 좋다고 생각하나요?","我觉得各有各的好处，但对年轻人来说，大城市更好。大城市工作机会多，文化生活也很丰富。当然，大城市生活节奏快，竞争激烈。等我年纪大了，我可能会选择搬到空气好、安静的小城市去。","장단점이 있지만 젊은이에겐 대도시가 나아요. 일자리와 문화생활이 풍부하니까요. 나이 들면 조용한 소도시로 옮길 수도 있어요."],["","你认为公司应该实行弹性工作制吗？","회사가 유연근무제를 시행해야 한다고 생각하나요?","我非常支持弹性工作制。每个人的生活习惯不同，有的人早上效率高，有的人下午效率高。员工能自己安排时间，就能避开上下班高峰，工作也会更积极。只要能按时完成任务，上班时间灵活一点儿没什么问题。","적극 찬성해요. 사람마다 효율 높은 시간이 다르고, 출퇴근 혼잡도 피할 수 있어요. 업무만 제때 끝내면 문제없어요."],["","你怎么看待整容？","성형수술을 어떻게 생각하나요?","我觉得整容是个人的选择，别人不应该随便批评。如果整容能让一个人更有自信，那也不是坏事。但是整容有一定的风险，所以一定要慎重考虑，选择正规的医院。另外，我认为内在的魅力比外表更重要。","개인의 선택이니 비난할 필요는 없고 자신감을 준다면 괜찮아요. 다만 위험이 있으니 신중해야 하고, 내면이 외모보다 중요해요."]],"p6":[["친구가 초대장 메시지를 보여주며 웃고 있고, 나는 달력의 토요일 칸 ‘출장’ 메모를 보고 있다.","朋友请你周末去他家吃饭，可是你有事去不了。请你拒绝并说明理由。","친구가 주말에 집에 초대했는데 일이 있어 못 가요. 이유를 말하며 거절하세요.","谢谢你请我去你家吃饭，我真的很想去。可是这个周末我要去釜山出差，星期天晚上才回来。真不好意思！下次我请你吃饭吧，你看下周五怎么样？","초대 고마워. 정말 가고 싶은데 이번 주말 부산 출장이라 일요일 밤에 와. 미안해! 다음 주 금요일에 내가 밥 살게."],["택배 상자에서 꺼낸 셔츠가 몸에 너무 작다. 나는 휴대폰으로 고객센터에 전화하고 있다.","你在网上买的衣服尺寸不合适，请给客服打电话要求换货。","인터넷에서 산 옷 사이즈가 안 맞아요. 고객센터에 전화해 교환을 요청하세요.","您好，我前天在你们网店买了一件白衬衫，订单号是3721。我买的是中号，可是穿起来太紧了。我想换成大号的，请问应该怎么办？运费需要我出吗？","안녕하세요, 그제 흰 셔츠를 샀는데(주문번호 3721) M이 너무 끼어요. L로 교환하고 싶은데 어떻게 하나요? 배송비는 제가 내나요?"],["도서관 앞 벤치. 시험지를 든 친구가 고개를 숙이고 있다.","你的朋友考试没考好，心情很不好，请你安慰他。","친구가 시험을 망쳐 기분이 안 좋아요. 위로해 주세요.","别难过了，一次考试说明不了什么。你平时那么努力，大家都看在眼里。这次可能只是太紧张了。我们一起找找问题在哪儿，下次一定能考好。走，我请你吃冰淇淋去！","속상해하지 마. 시험 한 번으로 다 정해지지 않아. 평소 노력한 거 다 알아. 같이 문제점을 찾아보자. 가자, 아이스크림 사줄게!"]]},"3":{"p2":[["거리 풍경. 서점은 은행 바로 오른쪽 옆에 있다.","书店在哪儿？","서점은 어디에 있나요?","书店在银行旁边。","서점은 은행 옆에 있어요."],["달력. 5월 14일 화요일에 동그라미가 쳐져 있다.","今天几月几号？星期几？","오늘은 몇 월 며칠, 무슨 요일인가요?","今天五月十四号，星期二。","5월 14일 화요일이에요."],["운동장에서 아이들 네 명이 축구공을 차고 있다.","孩子们在做什么？","아이들은 무엇을 하고 있나요?","孩子们在踢足球。","아이들은 축구하고 있어요."],["저울 위에 수박 한 통. 눈금이 4.5kg을 가리킨다.","这个西瓜有多重？","이 수박은 무게가 얼마예요?","这个西瓜四点五公斤。","4.5킬로그램이에요."]],"p3":[["명절 가족사진이 걸린 거실. 친구가 사진을 가리킨다.","你有兄弟姐妹吗？","형제자매가 있어요?","我有一个哥哥，他比我大三岁，现在在美国工作。","오빠(형)가 한 명 있어요. 세 살 많고 미국에서 일해요."],["퇴근 무렵 사무실. 동료가 가방을 챙기며 말한다.","下班以后我们一起去喝杯啤酒吧？","퇴근 후 같이 맥주 한잔할래요?","好主意！不过我得先把这份文件发出去，你等我十分钟可以吗？","좋아요! 근데 이 문서 먼저 보내야 해서 10분만 기다려줄래요?"],["영화관 매표소 앞. 친구가 포스터를 보며 묻는다.","你最近看过什么电影？","최근에 무슨 영화 봤어요?","上个星期我看了一部科幻电影，特效做得非常棒，故事也很感人。","지난주에 SF 영화를 봤는데 특수효과가 멋지고 이야기도 감동적이었어요."],["카페. 친구가 내 새 휴대폰을 들어 보고 있다.","你的手机是什么时候买的？","휴대폰은 언제 샀어요?","上个月刚买的。旧手机用了四年，电池不行了，所以就换了。","지난달에 막 샀어요. 예전 폰을 4년 써서 배터리가 다 됐거든요."],["호텔 프런트. 직원이 체크인 서류를 내민다. (내가 손님)","您好，请问您要住几个晚上？","안녕하세요, 몇 박 하시겠어요?","我住三个晚上，星期五上午退房。对了，房间里有免费无线网吗？","3박이요. 금요일 오전에 체크아웃해요. 참, 방에 무료 와이파이 있나요?"]],"p4":[["","请介绍一下你的家人。","가족을 소개해 주세요.","我家有四口人：爸爸、妈妈、妹妹和我。爸爸退休以后开始种菜，妈妈很会做饭。妹妹是小学老师，脾气很温和。虽然我们平时都很忙，但每个月至少一起吃一次饭。","아빠, 엄마, 여동생, 저 네 식구예요. 아빠는 은퇴 후 텃밭을 가꾸고 엄마는 요리를 잘해요. 여동생은 초등학교 선생님이에요. 바빠도 한 달에 한 번은 같이 밥을 먹어요."],["","你一般多久理一次发？在哪儿理？","보통 얼마 만에 머리를 자르고, 어디서 자르나요?","我差不多一个月理一次发。我常去家附近的一家理发店，那里的理发师手艺很好，而且很了解我喜欢什么样的发型，所以我去了五六年了。","한 달에 한 번쯤 자르고, 집 근처 미용실에 5~6년째 다녀요. 실력도 좋고 제 취향을 잘 알아요."],["","你最难忘的一次旅行是什么？","가장 잊을 수 없는 여행은?","最难忘的是大学毕业时和同学们去越南旅行。我们一起坐船看海上的小岛，晚上在夜市吃各种小吃。虽然只有五天，但那是我第一次出国，所以印象特别深。","대학 졸업 때 친구들과 간 베트남 여행이요. 배로 섬을 구경하고 야시장에서 먹거리를 즐겼어요. 첫 해외여행이라 인상이 깊어요."],["","你早饭一般吃什么？","아침은 보통 뭘 먹나요?","工作日早上时间很紧张，我一般只喝一杯牛奶，吃一个面包或者一根香蕉。周末时间充裕，我会给自己煮一碗粥，再煎个鸡蛋。我觉得不吃早饭对胃不好，所以再忙也会吃一点儿。","평일엔 우유와 빵이나 바나나, 주말엔 죽을 끓이고 계란을 부쳐요. 아침을 거르면 위에 안 좋아서 바빠도 조금은 먹어요."],["","你喜欢什么样的天气？为什么？","어떤 날씨를 좋아하나요? 왜요?","我最喜欢秋天那种晴朗、凉快的天气。不冷不热，天空特别蓝，很适合出去散步或者骑自行车。相反，我不喜欢又闷又热的夏天，因为一出门就满身是汗。","맑고 선선한 가을 날씨요. 하늘이 파랗고 산책이나 자전거 타기 좋아요. 반대로 후덥지근한 여름은 땀이 나서 싫어요."]],"p5":[["","你认为学历对找工作重要吗？","학력이 취업에 중요하다고 생각하나요?","我认为学历在一定程度上是重要的，因为很多公司会先看学历来筛选简历。但是学历只是一块敲门砖，真正决定你能不能做好工作的是能力和经验。所以我觉得，年轻人除了读书以外，更应该多积累实践经验。","어느 정도는 중요해요. 서류 심사에서 먼저 보니까요. 하지만 학력은 문을 두드리는 도구일 뿐이고, 결국 실력과 경험이 중요해요."],["","你觉得孩子用智能手机有什么问题？","아이들이 스마트폰을 쓰는 데 어떤 문제가 있다고 보나요?","我觉得问题不少。第一，长时间看屏幕对视力不好。第二，孩子自控能力差，很容易沉迷游戏和短视频，影响学习。第三，网上有些内容不适合孩子看。所以，父母应该规定使用时间，并且多陪孩子到户外活动。","시력 저하, 게임과 짧은 영상 중독, 유해 콘텐츠 문제가 있어요. 부모가 사용 시간을 정하고 야외 활동을 함께 해야 해요."],["","你认为退休以后应该做什么？","은퇴 후에는 무엇을 해야 한다고 생각하나요?","我认为退休以后，首先要保持身体健康，比如坚持散步、游泳。其次，可以学一些以前没时间学的东西，像画画、书法或者外语。另外，参加志愿者活动也很有意义，既能帮助别人，又不会觉得孤单。","먼저 건강을 유지하고, 못 배웠던 그림·서예·외국어를 배우면 좋아요. 봉사활동도 의미 있고 외롭지 않아요."],["","你怎么看待一人家庭越来越多的现象？","1인 가구가 늘어나는 현상을 어떻게 보나요?","这是社会发展的自然结果。现在很多人工作忙，结婚晚，也更追求独立的生活。一人家庭的好处是自由，但问题是容易感到孤独，生病时也没人照顾。所以我觉得社会应该为一人家庭提供更多的服务，比如社区活动和小户型住房。","사회 발전의 자연스러운 결과예요. 자유롭지만 외롭고 아플 때 돌봐줄 사람이 없어요. 사회가 커뮤니티 활동, 소형 주택 같은 지원을 늘려야 해요."]],"p6":[["사무실 책상 위 서류 더미. 시계는 오후 6시. 나는 휴대폰으로 친구에게 전화를 걸고 있다.","你和朋友约好今晚见面，可是公司突然要加班。请给朋友打电话改约时间。","친구와 오늘 밤 약속이 있는데 갑자기 야근하게 됐어요. 친구에게 전화해 약속을 바꾸세요.","喂，秀英，是我。真抱歉，我们公司刚才突然通知要加班，今晚可能九点以后才能走。我们的约会改到明天晚上行吗？餐厅我来重新预订，就当是给你赔礼了。","수영아, 정말 미안해. 회사에서 갑자기 야근하래서 9시 넘어야 끝날 것 같아. 약속을 내일 저녁으로 바꿔도 될까? 식당은 내가 다시 예약할게."],["호텔 방. 에어컨 리모컨에 불이 안 들어오고 나는 땀을 닦으며 프런트에 전화하고 있다.","你住的酒店房间空调坏了，请跟前台说明情况。","호텔 방 에어컨이 고장 났어요. 프런트에 상황을 설명하세요.","你好，我是1508号房间的客人。房间的空调好像坏了，怎么按都没有反应，屋里特别热。能不能麻烦你们马上派人来修一下？如果修不好的话，可以给我换个房间吗？","1508호인데 에어컨이 고장 나서 아무리 눌러도 반응이 없고 너무 더워요. 바로 수리해 주실 수 있나요? 안 되면 방을 바꿔 주세요."],["사무실. 동료의 책상 위에 ‘승진 축하’ 꽃다발이 놓여 있다.","你的同事升职了，请你祝贺他。","동료가 승진했어요. 축하해 주세요.","小陈，恭喜恭喜！听说你升为部长了，真为你高兴。这几年你工作那么努力，这是你应得的。以后还请多多指教！今天下班我们请你吃饭，好好庆祝一下吧。","천 씨, 축하해요! 부장이 됐다니 정말 기뻐요. 그동안 열심히 했으니 당연한 결과예요. 앞으로도 잘 부탁해요! 오늘 퇴근 후 밥 사줄게요."]]},"4":{"p2":[["교복을 입은 여학생이 자전거를 타고 학교 정문으로 가고 있다.","她怎么去学校？","그녀는 어떻게 학교에 가나요?","她骑自行车去学校。","자전거를 타고 학교에 가요."],["마네킹이 입은 셔츠에 가격표 199元이 붙어 있다.","这件衬衫多少钱？","이 셔츠는 얼마예요?","这件衬衫一百九十九块。","이 셔츠는 199위안이에요."],["거실 소파 쿠션 위에 열쇠 꾸러미가 놓여 있다.","钥匙在哪儿？","열쇠는 어디에 있나요?","钥匙在沙发上。","열쇠는 소파 위에 있어요."],["일기예보 화면. 北京 영하 5°C, 上海 3°C.","哪个城市更冷？","어느 도시가 더 추운가요?","北京更冷，比上海低八度。","베이징이 더 추워요. 상하이보다 8도 낮아요."]],"p3":[["주차장. 친구가 자동차 열쇠를 흔들며 묻는다.","你会开车吗？","운전할 줄 알아요?","会开，我去年拿到了驾照，不过还不太熟练，高速公路我还不敢开。","할 줄 알아요. 작년에 면허를 땄는데 아직 서툴러서 고속도로는 겁나요."],["사무실. 동료가 코를 훌쩍이며 휴지를 들고 있다.","我感冒了，你有药吗？","감기 걸렸는데 약 있어요?","我包里正好有感冒药，给你。吃完药多喝点儿热水，早点儿回家休息吧。","마침 가방에 감기약이 있어요. 먹고 따뜻한 물 많이 마시고 일찍 들어가 쉬어요."],["여행사 포스터 앞. 친구가 묻는다.","你暑假打算去哪儿玩？","여름휴가에 어디 놀러 갈 거예요?","我打算和家人去江原道，那里有山有海，还可以玩冲浪。","가족과 강원도에 갈 거예요. 산도 바다도 있고 서핑도 할 수 있어요."],["백화점 앞. 친구가 쇼핑백을 들고 묻는다.","你一般在哪儿买衣服？","옷은 보통 어디서 사요?","我一般在网上买，又便宜又方便。不过买外套的时候，我会去商场亲自试试。","보통 인터넷에서 사요. 싸고 편하니까요. 외투는 매장에서 직접 입어봐요."],["택시 뒷좌석에 탄 내게 기사가 고개를 돌려 묻는다. (내가 승객)","您好，您去哪儿？","안녕하세요, 어디로 가세요?","师傅，我去首尔站。我有点儿赶时间，麻烦您走最快的路吧。","기사님, 서울역이요. 좀 급하니 가장 빠른 길로 가 주세요."]],"p4":[["","你有什么爱好？","취미가 무엇인가요?","我的爱好是拍照。周末我常常带着相机去公园或者老街，拍一些花草和普通人的生活。拍照让我更细心地观察身边的东西，也让我学会了发现生活中的美。","사진 찍기예요. 주말에 공원이나 옛 거리에서 꽃과 사람들의 일상을 찍어요. 주변을 세심히 관찰하고 생활 속 아름다움을 발견하게 돼요."],["","你住的地方附近有什么设施？","사는 곳 근처에 어떤 시설이 있나요?","我家附近生活设施很齐全。走路五分钟就有一个大超市，旁边还有银行和医院。小区后面有一个公园，晚上很多人在那儿跑步。唯一的缺点是离地铁站有点儿远。","걸어서 5분 거리에 마트, 은행, 병원이 있고 단지 뒤에 공원도 있어요. 유일한 단점은 지하철역이 좀 멀다는 거예요."],["","你上班的时候最忙的是什么时候？","직장에서 가장 바쁜 때는 언제인가요?","我们公司每个月月底最忙，因为要整理这个月的销售数据，还要写下个月的计划。那几天我经常加班到晚上十点。虽然很辛苦，但完成以后很有成就感。","매달 말이 가장 바빠요. 판매 데이터 정리와 다음 달 계획 작성 때문에 밤 10시까지 야근해요. 힘들지만 끝나면 뿌듯해요."],["","你喜欢看什么类型的电影？","어떤 장르의 영화를 좋아하나요?","我最喜欢看喜剧片。工作一天以后，看一部轻松搞笑的电影，所有的压力都没了。我不太喜欢恐怖片，因为看完以后晚上会睡不着觉。","코미디를 좋아해요. 하루 일하고 가볍고 웃긴 영화를 보면 스트레스가 다 풀려요. 공포 영화는 잠이 안 와서 싫어요."],["","你会做什么菜？","어떤 요리를 할 줄 아나요?","我会做的菜不多，最拿手的是泡菜炒饭。做法很简单：先把泡菜和猪肉切成小块，炒香以后放米饭，最后在上面放一个煎鸡蛋。朋友们来我家的时候，我常常做给他们吃，大家都说好吃。","많지는 않지만 김치볶음밥이 특기예요. 김치와 돼지고기를 볶다가 밥을 넣고 계란프라이를 올려요. 친구들이 맛있대요."]],"p5":[["","你认为人工智能会代替人的工作吗？","인공지능이 사람의 일을 대신할 것이라고 생각하나요?","我认为人工智能会代替一部分工作，特别是重复性的、简单的工作，比如收银、数据录入。但是需要创造力和人际沟通的工作，人工智能很难完全代替。所以我们不应该害怕，而是要学会利用人工智能，提高自己的能力。","반복적이고 단순한 일은 대체되겠지만 창의력과 소통이 필요한 일은 어려워요. 두려워하기보다 활용법을 배워 역량을 키워야 해요."],["","你觉得跳槽对职业发展有好处吗？","이직이 경력 발전에 도움이 된다고 생각하나요?","我觉得适当的跳槽有好处。换一个新环境可以学到新技能，工资也可能提高。但是如果跳槽太频繁，公司会觉得你不稳定，不愿意录用你。所以跳槽之前一定要想清楚，自己到底想要什么。","적당한 이직은 새 기술과 연봉 상승에 도움이 돼요. 하지만 너무 잦으면 불안정해 보여요. 원하는 게 뭔지 먼저 분명히 해야 해요."],["","你认为父母应该给孩子零花钱吗？","부모가 아이에게 용돈을 줘야 한다고 생각하나요?","我认为应该给。孩子有了零花钱，就能学会怎么管理钱，知道钱来得不容易。不过父母要注意两点：一是金额不能太多；二是要教孩子记账，让他们养成合理消费的好习惯。","줘야 해요. 돈 관리법과 돈의 소중함을 배워요. 다만 금액은 적당히, 그리고 용돈 기입장을 쓰게 해서 합리적 소비 습관을 길러야 해요."],["","你认为保护环境，个人能做些什么？","환경 보호를 위해 개인이 할 수 있는 일은?","个人能做的事情其实很多。比如出门尽量坐公共交通，少开车；买东西自己带购物袋，少用塑料袋；在家随手关灯，节约用水。这些都是小事，但是如果每个人都坚持，就会产生很大的作用。","대중교통 이용, 장바구니 사용, 소등과 절수 같은 작은 일이요. 모두가 꾸준히 하면 큰 효과가 있어요."]],"p6":[["학원 광고 전단 ‘중국어 회화반 모집’. 나는 전단을 보며 전화를 걸고 있다.","你想参加汉语学习班，请给学院打电话询问上课时间和费用。","중국어 학원에 다니고 싶어요. 학원에 전화해 수업 시간과 비용을 물어보세요.","您好，我在网上看到你们的汉语会话班在招生，想咨询一下。我是上班族，只有晚上和周末有时间，请问有晚上七点以后的课吗？一个月学费是多少？第一次上课以前需要参加水平测试吗？","안녕하세요, 중국어 회화반 문의드려요. 직장인이라 저녁과 주말만 되는데 7시 이후 수업이 있나요? 한 달 수강료는요? 레벨테스트가 필요한가요?"],["밤 11시. 천장에서 쿵쿵 소리가 나고 나는 윗집 현관문 앞에 서 있다.","楼上的邻居晚上总是很吵，请你去跟他沟通一下。","윗집이 밤마다 시끄러워요. 가서 이야기해 보세요.","您好，我是楼下的。打扰您了，不好意思。最近每天晚上十一点以后，楼上总是有咚咚的声音，我第二天要早起上班，经常被吵醒。您看晚上能不能小声一点儿，或者在地上铺块地毯？谢谢您的理解。","아랫집인데요, 죄송하지만 요즘 밤 11시 넘어 쿵쿵 소리가 나서 자꾸 깨요. 밤에는 조금 조용히 해주시거나 매트를 깔아주실 수 있을까요?"],["전자제품 매장. 친구가 노트북 여러 대 앞에서 고민하고 있다.","你的朋友想买笔记本电脑，请你给他推荐一款。","친구가 노트북을 사려고 해요. 하나 추천해 주세요.","你主要是用来上网和写报告吧？那我推荐你买这款，它特别轻，才一点二公斤，带着上下班很方便。而且电池能用十个小时，价格也不算贵。最近正好有活动，还送鼠标呢！","주로 인터넷과 보고서용이지? 그럼 이거 추천해. 1.2kg이라 가볍고 배터리가 10시간이나 가. 가격도 괜찮고 지금 행사로 마우스도 줘!"]]},"5":{"p2":[["진료실. 흰 가운을 입고 청진기를 목에 건 남자가 환자를 진찰하고 있다.","他是做什么工作的？","그는 무슨 일을 하나요?","他是医生。","그는 의사예요."],["명함 한 장. ‘王丽 手机 010-3528-7461’.","她的手机号码是多少？","그녀의 휴대폰 번호는 몇 번이에요?","她的手机号码是零幺零，三五二八，七四六幺。","010-3528-7461이에요."],["식당 테이블에 가족 네 명이 둘러앉아 식사하고 있다.","他们在哪儿吃饭？","그들은 어디에서 밥을 먹나요?","他们在饭馆吃饭。","식당에서 밥을 먹어요."],["100m 달리기 기록판. 小张 12초, 小刘 14초.","谁跑得快？","누가 더 빨리 달리나요?","小张跑得快，比小刘快两秒。","샤오장이 2초 더 빨라요."]],"p3":[["공원. 강아지를 산책시키는 이웃이 묻는다.","你喜欢养宠物吗？","반려동물 키우는 걸 좋아해요?","很喜欢，可是我住的公寓不能养狗，所以只养了两条金鱼。","좋아하는데 우리 아파트는 강아지가 안 돼서 금붕어 두 마리만 키워요."],["사무실. 동료가 화면이 꺼진 노트북을 가리키며 난감해한다.","我的电脑坏了，你能帮我看看吗？","컴퓨터가 고장 났는데 좀 봐줄 수 있어요?","没问题，我先帮你重启一下试试。要是还不行，我们就找技术部的人吧。","그럼요, 먼저 재부팅해 볼게요. 그래도 안 되면 기술팀에 연락해요."],["캐리어가 놓인 현관. 친구가 묻는다.","你上次去旅行是什么时候？","마지막으로 여행 간 게 언제예요?","是今年春天，我和朋友去了庆州，看了樱花，还参观了很多古迹。","올봄에 친구와 경주에 가서 벚꽃도 보고 유적지도 많이 봤어요."],["회사 탕비실. 커피머신 앞에서 동료가 묻는다.","你一天喝几杯咖啡？","하루에 커피 몇 잔 마셔요?","我一天喝两杯，上午一杯，午饭后一杯。下午三点以后我就不喝了，怕晚上睡不着。","하루 두 잔이요. 오전과 점심 후에 한 잔씩. 3시 이후엔 잠이 안 올까 봐 안 마셔요."],["은행 창구. 직원이 번호표를 확인하며 묻는다. (내가 고객)","您好，请问您要办什么业务？","안녕하세요, 어떤 업무 보시겠어요?","我想开一个新账户，顺便办一张银行卡。这是我的护照。","새 계좌를 만들고 체크카드도 발급받고 싶어요. 여기 여권이요."]],"p4":[["","你的生活习惯中，有没有想改掉的坏习惯？","생활 습관 중 고치고 싶은 나쁜 습관이 있나요?","有，我最想改掉的是睡前玩手机的习惯。我常常躺在床上刷视频，一不小心就到了凌晨一两点，第二天上班没精神。最近我把手机放在客厅充电，情况好了一些。","자기 전 휴대폰 보는 습관이요. 영상을 보다 새벽 1~2시가 되면 다음 날 힘들어요. 요즘은 휴대폰을 거실에서 충전해서 좀 나아졌어요."],["","请介绍一下你们公司或学校。","당신의 회사나 학교를 소개해 주세요.","我在一家做化妆品的公司工作，公司在首尔江南，员工大约三百人。我们的产品主要出口到中国和东南亚。公司气氛很自由，同事之间关系也很好，每个月还有一次读书会。","강남에 있는 화장품 회사에 다녀요. 직원은 약 300명이고 중국과 동남아로 수출해요. 분위기가 자유롭고 동료 사이도 좋아요."],["","你今年的计划是什么？","올해 계획은 무엇인가요?","我今年有两个计划。一个是考到TSC五级，所以每天下班后都练习一个小时口语。另一个是减肥五公斤，现在我每周去三次健身房。到目前为止，两个计划都进行得还不错。","TSC 5급 취득과 5kg 감량이요. 매일 퇴근 후 회화 1시간, 주 3회 헬스장에 가요. 지금까지 순조로워요."],["","你一般怎么过节？","명절은 보통 어떻게 보내나요?","在韩国，中秋节和春节是最重要的节日。每到过节，我都会回老家看爷爷奶奶。全家人一起做松饼、包饺子，晚上一边吃饭一边聊天。虽然路上很堵，但是能和家人团聚，我觉得很幸福。","추석과 설에는 고향에 가서 조부모님을 뵙고 송편과 만두를 빚어요. 길은 막혀도 가족이 모이니 행복해요."],["","你更喜欢城市生活还是农村生活？","도시와 시골 생활 중 무엇이 더 좋나요?","我更喜欢城市生活。城市里交通方便，看病、购物都很容易，还有很多学习和工作的机会。不过偶尔我也会去农村住几天，呼吸新鲜空气，享受安静的感觉。","도시가 좋아요. 교통, 병원, 쇼핑이 편하고 기회도 많아요. 그래도 가끔 시골에서 며칠 쉬며 맑은 공기를 즐겨요."]],"p5":[["","你觉得公司聚餐有必要吗？","회식이 필요하다고 생각하나요?","我觉得适当的聚餐是有必要的。平时大家忙着工作，没有时间聊天，聚餐可以增进同事之间的感情。但是聚餐不应该太频繁，也不应该强迫员工喝酒。最好在下班时间以内结束，或者改成一起吃午饭。","적당한 회식은 친목에 도움이 돼요. 다만 너무 잦거나 음주를 강요해선 안 되고, 일찍 끝내거나 점심 회식으로 바꾸면 좋아요."],["","你认为上补习班对学生有帮助吗？","학원에 다니는 것이 학생에게 도움이 된다고 생각하나요?","我认为补习班有帮助，但也有副作用。好处是老师会针对考试重点讲解，学生成绩提高得快。坏处是学生每天上完学校又去补习班，几乎没有休息时间，压力非常大，还会失去自主学习的能力。所以要根据孩子的情况选择，不能盲目跟风。","성적 향상에는 도움이 되지만, 쉴 시간이 없고 스트레스가 크며 자기주도 학습 능력을 잃을 수 있어요. 아이 상황에 맞게 골라야 해요."],["","你认为什么样的领导是好领导？","어떤 리더가 좋은 리더라고 생각하나요?","我认为好领导首先要以身作则，自己先做到，再要求别人。其次，要善于倾听，尊重下属的意见。再次，下属犯错的时候，好领导不是只会批评，而是帮助他们找到解决办法。这样的领导，大家都愿意跟着他干。","솔선수범하고, 부하 의견을 경청하며, 실수했을 때 질책보다 해결을 돕는 리더요. 그런 리더는 모두가 따르고 싶어 해요."],["","你怎么看待网上的恶意评论？","인터넷 악성 댓글을 어떻게 생각하나요?","我认为恶意评论是一种暴力。因为网上可以匿名，有些人就随便攻击别人，给别人带来很大的伤害，甚至有人因此患上抑郁症。我觉得网站应该加强管理，政府也应该制定相关法律，同时我们每个人发言前也要三思。","악플은 폭력이에요. 익명을 이용해 공격하고 큰 상처를 줘요. 사이트 관리 강화, 관련 법 제정, 그리고 각자 말하기 전에 신중해야 해요."]],"p6":[["식당. 주변 테이블은 다 음식이 나왔는데 내 테이블만 비어 있다. 시계는 주문 후 40분 경과.","你在饭馆点的菜一直没上，请跟服务员说。","식당에서 주문한 음식이 계속 안 나와요. 종업원에게 말하세요.","服务员，麻烦你一下。我们四十分钟以前就点菜了，可是到现在一个菜都没上。比我们晚来的客人都已经吃上了。能帮我们催一下吗？要是还要很久的话，我们就取消吧。","저기요, 40분 전에 주문했는데 아직 하나도 안 나왔어요. 늦게 온 손님도 먹고 있네요. 재촉 좀 해 주세요. 오래 걸리면 취소할게요."],["친구가 체중계 위에서 한숨을 쉬고 있고, 식탁에는 치킨과 콜라가 있다.","你的朋友想减肥，但总是坚持不了，请你给他一些建议。","친구가 다이어트를 하려는데 늘 실패해요. 조언해 주세요.","我觉得你不要一下子定太高的目标，先从小事做起。比如每天晚上八点以后不吃东西，把可乐换成白开水。运动也不用太累，每天快走三十分钟就行。要不我们一起报名游泳课吧，有个伴儿就更容易坚持了。","처음부터 목표를 높게 잡지 말고 밤 8시 이후 금식, 콜라 대신 물부터 해봐. 운동은 매일 30분 빠르게 걷기면 돼. 같이 수영 등록할래?"],["카페. 나는 빈손으로 미안한 표정을 짓고, 맞은편 친구는 ‘책 가져왔어?’라고 묻는 듯하다.","你借了朋友的书，可是不小心弄丢了，请你向朋友道歉。","친구에게 빌린 책을 잃어버렸어요. 친구에게 사과하세요.","真对不起，你借给我的那本小说，我不小心落在地铁上了，找了好几天也没找到。我知道那本书对你很重要，我已经在网上订了一本新的，后天就能到。实在不好意思，今天这顿饭我请。","정말 미안해. 빌려준 소설을 지하철에 두고 내려서 며칠을 찾았는데 못 찾았어. 새 책을 주문해서 모레 도착해. 오늘 밥은 내가 살게."]]},"6":{"p2":[["일기예보 화면. 내일: 비 아이콘, 최고 18°C.","明天天气怎么样？","내일 날씨는 어때요?","明天下雨，最高气温十八度。","내일은 비가 오고 최고 기온은 18도예요."],["건물 안내판. ‘会议室 7F’.","会议室在几楼？","회의실은 몇 층이에요?","会议室在七楼。","회의실은 7층이에요."],["부엌 싱크대 앞에서 남자가 고무장갑을 끼고 그릇을 씻고 있다.","那个男人在厨房里干什么？","그 남자는 부엌에서 무엇을 하나요?","他在厨房里洗碗。","부엌에서 설거지하고 있어요."],["바지 옆에 줄자가 놓여 있고 98cm를 가리킨다.","这条裤子多长？","이 바지는 길이가 얼마예요?","这条裤子九十八厘米长。","이 바지는 길이가 98cm예요."]],"p3":[["점심시간. 동료가 혼자 도시락을 먹는 나를 보며 묻는다.","你喜欢一个人吃饭吗？","혼자 밥 먹는 거 좋아해요?","有时候喜欢。一个人吃饭很自在，还能一边吃一边看视频。","가끔은요. 혼자 먹으면 편하고 영상도 보면서 먹을 수 있어요."],["이삿짐 상자가 쌓인 집. 친구가 전화로 묻는다.","听说你要搬家了，需要帮忙吗？","이사한다며? 도와줄까?","太好了，谢谢你！我这个星期六搬，你能来帮我打包吗？我请你吃炸酱面。","고마워! 이번 토요일에 이사하는데 짐 싸는 것 좀 도와줄래? 짜장면 살게."],["저녁 지하철역. 친구가 묻는다.","你每天几点下班？","매일 몇 시에 퇴근해요?","我一般六点下班，可是这个月项目多，经常八点以后才能走。","보통 6시인데 이번 달은 프로젝트가 많아서 8시 넘어서 나가요."],["사계절 풍경 사진이 걸린 벽. 친구가 묻는다.","你最喜欢哪个季节？","어느 계절을 가장 좋아해요?","我最喜欢春天，天气暖和，到处都开满了花，心情也跟着变好了。","봄이요. 따뜻하고 곳곳에 꽃이 피어 기분이 좋아져요."],["서점 계산대 옆. 점원이 다가와 묻는다. (내가 손님)","您好，您找什么书？","안녕하세요, 어떤 책을 찾으세요?","我想找一本适合初学者的中文语法书，最好里面有练习题。","초보자용 중국어 문법책을 찾는데, 연습문제가 있으면 좋겠어요."]],"p4":[["","你平时睡得好吗？","평소 잠을 잘 자나요?","以前我经常失眠，躺在床上一两个小时也睡不着。后来我开始每天晚上泡脚、听轻音乐，还不再喝咖啡了。现在基本上躺下二十分钟就能睡着，睡眠质量好多了。","예전엔 불면증이 있었는데 족욕, 잔잔한 음악, 커피 끊기를 시작했어요. 지금은 20분이면 잠들고 수면의 질이 좋아졌어요."],["","你最喜欢的韩国菜是什么？请介绍一下。","가장 좋아하는 한국 음식을 소개해 주세요.","我最喜欢的是参鸡汤。它是把一整只小鸡和人参、大枣、糯米一起炖出来的。韩国人夏天最热的时候喜欢吃参鸡汤，觉得以热治热，能补充体力。汤很清淡，鸡肉又嫩又香。","삼계탕이요. 영계에 인삼, 대추, 찹쌀을 넣고 고아요. 한국인은 한여름에 이열치열로 기력을 보충하려고 먹어요. 국물이 담백하고 고기가 부드러워요."],["","你小时候常玩什么？","어릴 때 무엇을 하고 자주 놀았나요?","小时候我住在乡下，经常和邻居家的孩子在田里抓青蛙，在小河边玩水。冬天下雪的时候，我们还会堆雪人、打雪仗。那时候没有手机，但是每天都玩得特别开心。","시골에 살아서 논에서 개구리를 잡고 개울에서 물놀이를 했어요. 겨울엔 눈사람과 눈싸움. 휴대폰은 없었지만 매일 즐거웠어요."],["","你出门的时候一定会带什么东西？","외출할 때 꼭 챙기는 물건은?","我出门一定会带手机、钱包和充电宝。现在用手机可以付钱、坐地铁、查地图，要是手机没电了就麻烦了，所以充电宝对我来说特别重要。另外，因为我的皮肤容易过敏，我还会带一支防晒霜。","휴대폰, 지갑, 보조배터리요. 휴대폰으로 결제와 길 찾기를 하니 배터리가 꼭 필요해요. 피부가 예민해서 선크림도 챙겨요."],["","你和邻居的关系怎么样？","이웃과의 관계는 어떤가요?","我和邻居的关系还不错。我住的是公寓，平时见面会打个招呼。对门住着一对老夫妇，他们做了好吃的东西常常分给我一些。上次我出差的时候，他们还帮我收了快递。","사이가 좋아요. 마주치면 인사하고, 맞은편 노부부가 음식을 나눠 주세요. 출장 갔을 땐 택배도 받아 주셨어요."]],"p5":[["","你认为年轻人应该先存钱还是先享受生活？","젊은이는 저축이 먼저인가요, 인생을 즐기는 게 먼저인가요?","我认为应该在两者之间找到平衡。年轻的时候存钱很重要，因为以后买房、结婚都需要一笔钱，而且万一生病或者失业，也有保障。但是如果只知道存钱，完全不享受生活，就会错过很多美好的经历。所以我的办法是每个月把工资的一半存起来，剩下的用来生活和旅行。","둘 사이에 균형이 필요해요. 미래와 비상시를 위해 저축은 중요하지만, 즐기지 않으면 좋은 경험을 놓쳐요. 저는 월급의 절반을 저축해요."],["","你觉得在家办公有什么优缺点？","재택근무의 장단점은 무엇인가요?","在家办公的优点是不用挤地铁，节省了通勤时间，工作环境也更舒服。缺点是很难把工作和生活分开，有时候会一直工作到很晚。另外，和同事面对面交流少了，沟通效率可能会下降。我觉得一周在家办公两三天是最理想的。","장점은 출퇴근 시간 절약과 편한 환경, 단점은 일과 생활 구분이 어렵고 소통이 줄어드는 거예요. 주 2~3일 재택이 이상적이에요."],["","你认为人口老龄化会带来哪些问题？","인구 고령화는 어떤 문제를 가져온다고 생각하나요?","人口老龄化会带来很多问题。首先，劳动力减少，经济发展会变慢。其次，养老金和医疗费用增加，年轻人的负担会越来越重。还有，很多老人独自生活，需要更多照顾。所以政府应该鼓励生育，同时让身体健康的老人有机会继续工作。","노동력 감소로 경제가 둔화하고, 연금·의료비로 젊은 세대 부담이 커지며, 독거노인 돌봄이 필요해요. 출산 장려와 건강한 노인의 재취업이 필요해요."],["","你认为养宠物有什么好处和坏处？","반려동물을 키우는 장단점은?","养宠物的好处是可以给人带来快乐和安慰，特别是对一个人生活的人来说，宠物就像家人一样。另外，养狗的人每天都要遛狗，自然而然就锻炼了身体。坏处是要花不少钱和时间，出远门的时候也很不方便。所以决定养宠物以前，一定要考虑好自己能不能负责到底。","기쁨과 위로를 주고 혼자 사는 사람에게 가족 같아요. 산책으로 운동도 돼요. 단점은 비용과 시간, 장거리 외출의 불편함이에요. 끝까지 책임질 수 있는지 고민해야 해요."]],"p6":[["거실. 내가 여동생과 소파에 앉아 달력의 ‘부모님 결혼 30주년’ 날짜를 가리키고 있다.","下个月是父母的结婚纪念日，请你和妹妹商量怎么庆祝。","다음 달이 부모님 결혼기념일이에요. 여동생과 어떻게 축하할지 상의하세요.","妹妹，下个月十号是爸妈结婚三十周年纪念日，我们得好好准备一下。我想订一家安静的韩定食餐厅，全家一起吃顿饭。另外，我们俩一起出钱，送他们一次济州岛旅行，你觉得怎么样？你负责订餐厅，我来订机票和酒店吧。","다음 달 10일이 부모님 결혼 30주년이야. 조용한 한정식집을 예약하고, 우리 둘이 돈을 모아 제주도 여행을 보내드리면 어때? 넌 식당, 난 항공권이랑 호텔 맡을게."],["택시에서 내린 뒤 주머니를 뒤지는 나. 택시는 멀어지고 있고 손에는 영수증이 있다.","你在出租车上把手机落下了，请给出租车公司打电话。","택시에 휴대폰을 두고 내렸어요. 택시 회사에 전화하세요.","您好，我二十分钟前坐了你们公司的出租车，下车的时候把手机落在后座上了。车牌号是12가3456，我是在光化门下的车。我的手机是黑色的，手机壳上有一只小熊。麻烦您联系一下司机，好吗？我的电话是010-2234-5678。","20분 전 택시 뒷좌석에 휴대폰을 두고 내렸어요. 차량번호 12가3456, 광화문에서 내렸어요. 검은색에 곰 케이스예요. 기사님께 연락 부탁드려요."],["사무실. 신입 사원이 사원증을 목에 걸고 어색하게 서 있다.","新来的同事对公司不熟悉，请你给他介绍一下公司的情况。","새로 온 동료가 회사를 잘 몰라요. 회사 상황을 소개해 주세요.","欢迎你加入我们部门！我先给你简单介绍一下。我们早上九点上班，六点下班，中午十二点到一点是午休时间。员工食堂在地下一层，饭菜又便宜又好吃。打印机在走廊尽头，有什么不懂的随时问我就行。","우리 부서에 온 걸 환영해요! 9시 출근, 6시 퇴근, 점심은 12시~1시예요. 구내식당은 지하 1층이고 싸고 맛있어요. 프린터는 복도 끝, 모르는 건 언제든 물어보세요."]]},"7":{"p2":[["원피스를 입은 여자가 거울 앞에 서 있다. 원피스는 파란색.","她穿的裙子是什么颜色的？","그녀가 입은 치마는 무슨 색이에요?","她穿的裙子是蓝色的。","파란색이에요."],["영화관 전광판. ‘상영 시작 19:45’.","电影几点开始？","영화는 몇 시에 시작해요?","电影晚上七点四十五分开始。","저녁 7시 45분에 시작해요."],["주차장에 승용차 다섯 대가 세워져 있다.","停车场里有几辆车？","주차장에 차가 몇 대 있나요?","停车场里有五辆车。","차가 다섯 대 있어요."],["집 평면도. A방 25㎡, B방 18㎡.","哪个房间更大？","어느 방이 더 넓어요?","A房间更大，比B房间大七平方米。","A방이 7제곱미터 더 넓어요."]],"p3":[["부엌. 룸메이트가 냉장고를 열며 묻는다.","你会做饭吗？","요리할 줄 알아요?","会一点儿，简单的家常菜没问题，比如大酱汤、炒鸡蛋什么的。","조금요. 된장찌개나 계란볶음 같은 간단한 집밥은 할 수 있어요."],["사무실. 동료가 달력의 토요일을 가리키며 고민한다.","这个周六是小李的生日，我们送他什么礼物好呢？","이번 토요일이 샤오리 생일인데 무슨 선물을 하면 좋을까요?","他最近开始跑步了，我们一起凑钱给他买一双运动鞋吧。","요즘 달리기를 시작했으니 돈을 모아 운동화를 사 줘요."],["헬스장 입구. 친구가 묻는다.","你最近常常运动吗？","요즘 자주 운동해요?","最近太忙了，一个星期只能运动一两次，主要是在家做做瑜伽。","요즘 너무 바빠서 일주일에 한두 번, 주로 집에서 요가해요."],["지하철 안. 친구가 내 휴대폰 화면을 보며 묻는다.","你一般用手机做什么？","휴대폰으로 보통 뭘 해요?","我主要用手机听音乐、看新闻，有时候也用它背单词。","주로 음악 듣고 뉴스 보고, 가끔 단어도 외워요."],["병원 진료실. 의사가 차트를 펴고 묻는다. (내가 환자)","你哪儿不舒服？","어디가 불편하세요?","我从昨天开始嗓子疼，还有点儿发烧，晚上咳嗽得睡不好觉。","어제부터 목이 아프고 열이 좀 나요. 밤에 기침 때문에 잠을 못 자요."]],"p4":[["","你买东西的时候，最重视什么？","물건을 살 때 무엇을 가장 중시하나요?","我买东西的时候最重视质量。我宁可多花点儿钱买一个好的，也不愿意买便宜货用几天就坏了。所以买东西以前，我会先在网上看看别人的评价，比较几家店以后再决定。","품질이요. 싼 걸 사서 금방 망가지느니 돈을 더 써서 좋은 걸 사요. 그래서 후기를 보고 여러 곳을 비교한 뒤 결정해요."],["","你一般怎么和朋友联系？","친구와는 보통 어떻게 연락하나요?","我和朋友主要用聊天软件联系，每天都会在群里聊几句，分享好玩儿的视频。不过跟关系特别好的朋友，我更喜欢直接打电话，因为听到声音觉得更亲切。一个月我们也会见一两次面。","주로 메신저 단톡방에서 이야기하고 영상을 공유해요. 아주 친한 친구와는 목소리가 더 친근해서 전화하고, 한 달에 한두 번 만나요."],["","你最近读过的书是什么？","최근에 읽은 책은 무엇인가요?","我最近读了一本关于时间管理的书。书里说，我们应该先做重要的事情，而不是紧急的事情。读完以后，我每天早上都会先写下当天最重要的三件事，工作效率提高了不少。","시간 관리에 관한 책이요. 급한 일보다 중요한 일을 먼저 하라는 내용이에요. 그 후로 아침마다 중요한 일 세 가지를 적어서 효율이 많이 올랐어요."],["","你家里谁做家务最多？","집에서 누가 집안일을 가장 많이 하나요?","我家里做家务最多的是妈妈。她每天做饭、洗衣服、打扫卫生，从早忙到晚。最近我觉得妈妈太辛苦了，所以周末我负责打扫房间，爸爸负责洗碗，大家一起分担。","엄마요. 매일 요리, 빨래, 청소로 하루 종일 바쁘세요. 너무 힘드실 것 같아 요즘 주말엔 제가 청소, 아빠가 설거지를 맡아요."],["","你喜欢什么颜色？为什么？","어떤 색을 좋아하나요? 왜요?","我喜欢绿色。绿色让我想起森林和草地，看着就觉得心里很平静。我的房间里放了很多绿色的植物，窗帘也是浅绿色的。工作累了的时候，看看这些植物，眼睛和心情都能放松下来。","초록색이요. 숲과 풀밭이 떠올라 마음이 차분해져요. 방에 식물이 많고 커튼도 연두색이라 피곤할 때 보면 눈과 마음이 편해져요."]],"p5":[["","你认为成功最重要的条件是什么？","성공의 가장 중요한 조건은 무엇이라고 생각하나요?","我认为成功最重要的条件是坚持。不管做什么事情，都会遇到困难和失败，很多人就是在这个时候放弃的。只有坚持下去的人，才能看到最后的结果。当然，方向也很重要，如果方向错了，越努力离目标越远。","끈기예요. 어려움과 실패 앞에서 많은 사람이 포기하지만 끝까지 버틴 사람만 결과를 봐요. 물론 방향이 틀리면 노력할수록 멀어지니 방향도 중요해요."],["","你觉得一次性用品应该被禁止吗？","일회용품 사용을 금지해야 한다고 생각하나요?","我觉得应该逐步减少，但是不能一下子全部禁止。一次性用品给环境带来了严重的污染，塑料要几百年才能分解。但是在医院等一些地方，一次性用品是必要的。所以政府可以先对一次性用品收费，同时鼓励商家使用环保材料。","점진적으로 줄여야지 한 번에 금지할 수는 없어요. 플라스틱 오염은 심각하지만 병원 등에선 필요해요. 유료화와 친환경 소재 장려부터 해야 해요."],["","你认为大学生打工好不好？","대학생의 아르바이트는 좋은가요, 나쁜가요?","我认为大学生打工利大于弊。通过打工，大学生可以减轻父母的经济负担，也能提前了解社会，学会和不同的人打交道。不过学生的主要任务还是学习，所以打工的时间不要太长，最好找和自己专业有关的工作。","장점이 더 커요. 부모 부담을 덜고 사회를 미리 경험해요. 다만 본업은 공부이니 시간은 적당히, 전공 관련 일을 찾는 게 좋아요."],["","你怎么看待总是低头看手机的人？","늘 고개 숙여 휴대폰만 보는 사람들을 어떻게 보나요?","我觉得这种现象越来越严重了。在地铁上、饭桌上，到处都是低头看手机的人。这样不但对颈椎和眼睛不好，过马路的时候还很危险。更重要的是，家人朋友坐在一起，却各看各的手机，感情会越来越淡。我们应该有意识地放下手机，多和身边的人交流。","점점 심해지고 있어요. 목과 눈에 나쁘고 길 건널 때 위험해요. 무엇보다 함께 있어도 각자 휴대폰만 봐서 관계가 멀어져요. 의식적으로 내려놓고 대화해야 해요."]],"p6":[["공항 입국장. 친구에게서 ‘다음 달 서울 가!’라는 메시지가 와 있고, 나는 지도를 펼쳐 보고 있다.","你的朋友要来韩国旅游，请你帮他安排一下行程。","친구가 한국에 여행을 와요. 일정을 짜 주세요.","你来韩国玩三天，我帮你安排好了。第一天我们去景福宫，可以穿韩服拍照，晚上去明洞逛街。第二天坐KTX去釜山，看看大海，吃新鲜的生鱼片。第三天回首尔，去南山塔看夜景。你觉得怎么样？有什么想去的地方随时告诉我。","3일 일정을 짰어. 첫날 경복궁에서 한복 사진, 밤엔 명동. 둘째 날 KTX로 부산에 가서 바다와 회. 셋째 날 서울로 와서 남산타워 야경. 어때?"],["가전매장 고객센터. 나는 전기밥솥 상자와 영수증을 들고 직원 앞에 서 있다.","你买的电饭锅用了两天就坏了，请去商店要求退货。","산 전기밥솥이 이틀 만에 고장 났어요. 매장에 가서 환불을 요구하세요.","您好，这是我前天在这儿买的电饭锅，这是收据。才用了两天，今天早上就怎么也打不开了，指示灯也不亮。我觉得是质量问题，想退货。如果不能退的话，至少给我换一个新的吧。","그제 여기서 산 밥솥이고 영수증이에요. 이틀 만에 오늘 아침 전원이 안 들어와요. 품질 문제 같으니 환불해 주세요. 안 되면 새 제품으로 교환해 주세요."],["포장마차. 친구가 사직서 봉투를 테이블에 올려두고 술잔을 들고 있다.","你的朋友工作压力很大，想辞职，请你劝劝他。","친구가 업무 스트레스로 회사를 그만두려 해요. 설득해 보세요.","我知道你最近特别累，压力也很大。但是辞职是件大事，你先别着急做决定。要不先请几天假，出去旅游放松一下？回来以后再好好想想，是工作本身的问题，还是只是暂时太累。如果真的要换工作，最好先找到下一份工作再辞职。","요즘 많이 힘든 거 알아. 하지만 퇴사는 큰일이니 서두르지 마. 며칠 휴가 내고 여행 다녀와서 일 자체가 문제인지 잠깐 지친 건지 생각해 봐. 옮기더라도 다음 직장을 구하고 그만둬."]]},"8":{"p2":[["거리 풍경. 우체국은 슈퍼마켓 길 건너편 맞은편에 있다.","邮局在哪儿？","우체국은 어디에 있나요?","邮局在超市对面。","우체국은 슈퍼마켓 맞은편에 있어요."],["생일 케이크 위에 초 여섯 개가 꽂혀 있고 아이가 웃고 있다.","这个孩子今年几岁？","이 아이는 올해 몇 살이에요?","这个孩子今年六岁。","올해 여섯 살이에요."],["공원 벤치에 앉은 여자가 신문을 펼쳐 읽고 있다.","女的在看什么？","여자는 무엇을 보고 있나요?","她在看报纸。","신문을 보고 있어요."],["휴대폰 두 대 무게 표시. A 180g, B 205g.","哪个手机更轻？","어느 휴대폰이 더 가벼워요?","A手机更轻，比B轻二十五克。","A가 25그램 더 가벼워요."]],"p3":[["골목의 작은 카페. 친구가 단골 카드를 보여주며 묻는다.","你经常去咖啡厅吗？","카페에 자주 가요?","我差不多每天都去。我喜欢在咖啡厅工作，比在家里更容易集中精力。","거의 매일 가요. 카페에서 일하면 집보다 집중이 잘 돼요."],["현관. 엄마가 우산을 들고 묻는다.","明天要下雨，你带伞了吗？","내일 비 온다는데 우산 챙겼어?","哎呀，我差点儿忘了！我把那把折叠伞放进包里吧。","아, 깜빡할 뻔했어요! 접이식 우산을 가방에 넣을게요."],["어린 시절 사진첩을 넘기던 친구가 묻는다.","你小时候的梦想是什么？","어릴 때 꿈이 뭐였어요?","我小时候想当一名飞行员，因为我觉得在天上飞特别酷。","비행기 조종사요. 하늘을 나는 게 정말 멋져 보였거든요."],["이사 온 이웃이 엘리베이터에서 묻는다.","你家附近有什么好吃的饭馆？","집 근처에 맛있는 식당이 있어요?","小区门口有一家冷面店特别有名，夏天去要排队呢。","단지 입구에 유명한 냉면집이 있어요. 여름엔 줄 서야 해요."],["옷가게. 점원이 청바지를 들고 묻는다. (내가 손님)","您穿多大号的？","몇 사이즈 입으세요?","我平时穿二十八号的，不过这个牌子的裤子好像偏小，我能试一下二十九号吗？","보통 28인데 이 브랜드가 작게 나오는 것 같아요. 29 입어봐도 될까요?"]],"p4":[["","请介绍一下你的房间。","당신의 방을 소개해 주세요.","我的房间不大，但是很温馨。一进门左边是一张单人床，床旁边有一个小书架，上面摆满了我喜欢的漫画书。窗户前面是书桌，我每天晚上在那儿学汉语。我最喜欢的是窗台上的几盆小花，早上阳光照进来特别漂亮。","작지만 아늑해요. 왼쪽에 침대, 옆에 만화책이 꽂힌 책장, 창 앞엔 중국어 공부하는 책상이 있어요. 창가 화분에 아침 햇살이 비칠 때가 제일 좋아요."],["","你常去的地方是哪儿？","자주 가는 곳은 어디인가요?","我常去的地方是家附近的图书馆。那里环境安静，书也很多，而且是免费的。每个周六上午，我都会去那儿借几本书，在阅览室坐两三个小时。中午就在图书馆的食堂吃饭，又便宜又方便。","집 근처 도서관이요. 조용하고 책도 많고 무료예요. 토요일 오전마다 책을 빌려 열람실에서 두세 시간 보내고 구내식당에서 점심을 먹어요."],["","你学生时代最喜欢的科目是什么？","학창 시절 가장 좋아한 과목은?","我上学的时候最喜欢历史课。历史老师讲课特别生动，常常把历史事件讲得像故事一样。从那时起，我对各个国家的文化都很感兴趣，这也是我后来开始学中文的原因之一。","역사요. 선생님이 사건을 이야기처럼 생생하게 설명해 주셨어요. 그때부터 각국 문화에 관심이 생겼고, 중국어를 배우게 된 계기 중 하나예요."],["","你一般怎么保持健康？","보통 어떻게 건강을 유지하나요?","为了保持健康，我主要注意三点。第一是饮食，我尽量少吃油炸的东西，多吃蔬菜水果。第二是运动，每天上下班我都会少坐一站地铁，走路回家。第三是心态，有烦恼的时候，我会写日记，把不开心的事情写出来。","식단은 튀김을 줄이고 채소와 과일, 운동은 지하철 한 정거장 걷기, 마음은 고민이 있으면 일기를 써서 풀어요."],["","你做过的最后悔的事是什么？","가장 후회되는 일은 무엇인가요?","我最后悔的是大学的时候没有去交换留学。当时我有机会去中国学习一年，但是我担心适应不了，就放弃了。现在工作中经常要用汉语，我才发现那是一个多么好的机会。所以以后再遇到这样的机会，我一定不会犹豫。","대학 때 교환학생을 포기한 거요. 적응을 걱정해 중국 1년 기회를 놓쳤어요. 지금 업무에 중국어를 쓰면서 얼마나 좋은 기회였는지 알았어요."]],"p5":[["","你认为现代人为什么越来越重视健康？","현대인은 왜 점점 건강을 중시한다고 생각하나요?","我认为主要有三个原因。第一，生活水平提高了，人们不再只关心吃饱，而是追求生活的质量。第二，现在工作压力大，很多年轻人也出现了健康问题，大家开始意识到健康的重要性。第三，网络上关于健康的信息越来越多，人们更容易学到健康知识。","생활 수준 향상으로 삶의 질을 추구하고, 업무 스트레스로 젊은 층도 건강 문제를 겪으며, 인터넷에 건강 정보가 많아졌기 때문이에요."],["","你觉得出国留学一定有必要吗？","해외 유학이 꼭 필요하다고 생각하나요?","我觉得不一定。出国留学确实能开阔眼界，提高外语水平。但是留学的费用很高，不是每个家庭都能负担得起。而且现在网上有很多外国大学的课程，在国内也能学到先进的知识。所以关键不在于在哪儿学，而在于自己是不是真的努力。","꼭 그렇진 않아요. 시야를 넓히지만 비용이 크고, 지금은 온라인으로도 해외 강의를 들을 수 있어요. 어디서 배우냐보다 스스로 노력하느냐가 중요해요."],["","你认为电子书会代替纸质书吗？","전자책이 종이책을 대체할 것이라고 생각하나요?","我认为电子书不会完全代替纸质书。电子书携带方便，一个手机里可以放几千本书，价格也便宜。但是很多人还是喜欢纸质书的感觉，翻书的声音、纸的味道，都是电子书给不了的。而且长时间看屏幕眼睛容易累。所以我觉得两者会长期共存。","완전히 대체하진 못해요. 전자책은 휴대가 편하고 싸지만 종이책의 넘기는 소리와 냄새는 대신할 수 없고 화면은 눈이 피로해요. 둘은 오래 공존할 거예요."],["","你认为企业应该承担哪些社会责任？","기업은 어떤 사회적 책임을 져야 한다고 생각하나요?","我认为企业最基本的责任是提供安全、合格的产品，不能为了赚钱欺骗消费者。其次，企业应该保护环境，减少污染。另外，企业还应该保障员工的权益，比如按时发工资、提供安全的工作环境。如果有能力的话，企业也可以多做公益活动，回报社会。","안전한 제품 제공, 환경 보호, 직원 권익 보장(제때 급여, 안전한 환경)이 기본이고, 여력이 있으면 공익활동으로 사회에 환원해야 해요."]],"p6":[["달력의 다음 주 수요일에 ‘병원 검진’ 메모. 나는 근무표를 들고 동료에게 다가가고 있다.","你想请同事帮你代一天班，请跟他商量。","동료에게 하루 근무를 대신해 달라고 부탁하세요.","小林，我想跟你商量件事儿。下周三我要去医院做体检，上午没办法来上班。你那天休息，能不能帮我代一下班？作为交换，下周六你的班我来上，你看行吗？真是太麻烦你了。","샤오린, 다음 주 수요일에 건강검진이라 오전 출근이 어려워. 그날 쉬는 날인데 대신 근무해 줄 수 있어? 대신 다음 주 토요일 네 근무를 내가 할게."],["공항 수하물 벨트가 멈췄는데 내 캐리어만 없다. 나는 ‘수하물 분실 신고’ 창구 앞에 서 있다.","你在机场发现自己的行李没到，请跟工作人员说明。","공항에서 짐이 도착하지 않았어요. 직원에게 설명하세요.","您好，我是坐从上海飞来的东方航空MU5041航班到的，可是行李转盘已经停了，我的箱子还没出来。这是我的行李牌。我的箱子是银色的，二十四寸，上面贴着一张红色的标签。请您帮我查一下好吗？找到以后能送到我住的酒店吗？","상하이발 MU5041편인데 벨트가 멈췄는데도 짐이 안 나왔어요. 수하물표 여기 있어요. 은색 24인치, 빨간 스티커가 붙어 있어요. 찾으면 호텔로 보내 주실 수 있나요?"],["결혼식장. 신랑 신부가 웃고 있고 나는 마이크를 들고 하객 앞에 서 있다.","你的好朋友结婚了，请你在婚礼上说几句祝福的话。","친한 친구가 결혼했어요. 결혼식에서 축하 인사를 하세요.","大家好，我是新郎的大学同学。我们认识十年了，他是一个特别善良、可靠的人。今天看到他找到了这么美丽、温柔的新娘，我真的为他高兴。祝你们白头偕老，永远幸福！也希望你们早日有个可爱的宝宝。干杯！","신랑 대학 동기예요. 10년 지기인데 착하고 믿음직해요. 아름답고 다정한 신부를 만나 정말 기뻐요. 백년해로하고 늘 행복하길! 건배!"]]},"9":{"p2":[["부엌 식탁에서 가족이 밀가루 반죽을 펴고 만두를 빚고 있다.","他们在做什么？","그들은 무엇을 하고 있나요?","他们在包饺子。","만두를 빚고 있어요."],["입장권 판매대. ‘成人票 45元’. 두 사람이 줄을 서 있다.","两张票一共多少钱？","표 두 장이면 모두 얼마예요?","两张票一共九十块。","두 장에 90위안이에요."],["기차역 전광판. ‘G102 到达 15:20’.","火车几点到？","기차는 몇 시에 도착해요?","火车下午三点二十分到。","오후 3시 20분에 도착해요."],["카페 두 곳의 메뉴판. A카페 라떼 28元, B카페 라떼 22元.","哪家店的咖啡便宜？","어느 가게 커피가 싸요?","B店的咖啡便宜，比A店便宜六块。","B가게가 6위안 더 싸요."]],"p3":[["거실 TV 앞. 친구가 드라마 포스터를 들고 묻는다.","你喜欢看电视剧吗？","드라마 보는 거 좋아해요?","喜欢，我最近在追一部中国古装剧，一边看一边还能练听力。","좋아해요. 요즘 중국 사극을 정주행하는데 듣기 연습도 돼요."],["수영장 입구. 친구가 수영 가방을 들고 부탁한다.","我想学游泳，你能教我吗？","수영 배우고 싶은데 가르쳐 줄 수 있어요?","当然可以！不过我教得不太专业，我们先从憋气和漂浮开始练吧。","물론이죠! 전문적이진 않지만 숨 참기와 뜨기부터 연습해요."],["아침 회사. 동료가 묻는다.","你昨天晚饭吃了什么？","어제 저녁 뭐 먹었어요?","昨天我太累了，就点了一份外卖，是炸鸡和啤酒。","어제 너무 피곤해서 치킨이랑 맥주 배달시켰어요."],["생일 풍선이 달린 사무실. 동료가 묻는다.","你一般怎么过生日？","생일은 보통 어떻게 보내요?","我一般和家人一起吃顿饭，妈妈一定会给我煮一碗海带汤。","보통 가족과 식사해요. 엄마가 꼭 미역국을 끓여 주세요."],["영화관 매표소. 직원이 상영 시간표를 가리킨다. (내가 손님)","您好，您要几点的票？","안녕하세요, 몇 시 표 드릴까요?","我要两张晚上八点十分的，最好是中间靠后一点儿的位子。","저녁 8시 10분 두 장이요. 가운데 약간 뒤쪽 자리로 주세요."]],"p4":[["","你喜欢在家做饭还是在外面吃？","집에서 요리하는 것과 외식 중 무엇을 좋아하나요?","我更喜欢在家做饭。自己做饭可以选新鲜的材料，少放油和盐，吃得更健康，也比在外面吃省钱。不过工作特别忙的时候，我也会和同事在公司附近吃，或者叫外卖。","집밥이요. 신선한 재료로 기름과 소금을 줄여 건강하고 돈도 아껴요. 아주 바쁠 땐 회사 근처에서 먹거나 배달시켜요."],["","你的手机里最常用的应用程序是什么？","휴대폰에서 가장 자주 쓰는 앱은?","我最常用的是地图软件。我是一个路痴，去哪儿都离不开它。它不但能告诉我怎么走，还能显示公交车什么时候到，帮我节省了很多时间。另外，我也经常用一个学汉语的软件，每天背二十个单词。","지도 앱이요. 길치라 어디든 필요해요. 길 안내와 버스 도착 시간까지 알려줘서 시간을 아껴요. 중국어 앱으로 매일 단어 20개도 외워요."],["","你第一天上班的时候是什么心情？","첫 출근 날 기분은 어땠나요?","第一天上班的时候我既兴奋又紧张。前一天晚上我几乎没睡着，早上提前一个小时就到了公司。我怕说错话，一整天都不敢多说话。还好部门的前辈们都很热情，中午带我去吃饭，还教了我很多东西，我才慢慢放松下来。","설레면서도 긴장됐어요. 전날 잠을 거의 못 자고 1시간 일찍 도착했어요. 말실수할까 봐 조용했는데 선배들이 밥도 사주고 많이 알려줘서 긴장이 풀렸어요."],["","你旅行的时候喜欢住酒店还是民宿？","여행할 때 호텔과 민박 중 어디를 좋아하나요?","我更喜欢住民宿。民宿一般有当地的特色，房东也很热情，会告诉我哪儿有好吃的、好玩儿的地方，这是在酒店体验不到的。不过如果是出差，我还是会选择酒店，因为交通方便，服务也更规范。","민박이요. 지역 특색이 있고 주인이 맛집과 명소를 알려줘요. 출장이라면 교통이 편하고 서비스가 정돈된 호텔을 골라요."],["","你最近一次去医院是什么时候？因为什么？","최근 병원에 간 건 언제, 무엇 때문인가요?","我最近一次去医院是上个月。那天我打羽毛球的时候不小心扭到了脚，脚腕肿得很厉害。医生说没有伤到骨头，让我休息一个星期，还给我开了药。从那以后，我运动前都会认真做热身。","지난달 배드민턴 치다 발목을 삐어 많이 부었어요. 뼈는 괜찮아서 일주일 쉬라고 하셨어요. 그 뒤로 운동 전 준비운동을 꼭 해요."]],"p5":[["","你认为现在的孩子缺少什么？","요즘 아이들에게 부족한 것은 무엇이라고 생각하나요?","我认为现在的孩子物质上什么都不缺，但是缺少两样东西。一是自由玩耍的时间，他们每天都被各种课程排得满满的。二是和大自然接触的机会，很多孩子分不清韭菜和小麦。我觉得父母应该少给孩子报班，多带他们到户外去走走。","물질은 풍족하지만 자유롭게 놀 시간과 자연을 접할 기회가 부족해요. 학원을 줄이고 야외로 데려가야 해요."],["","你觉得物价上涨对生活有什么影响？","물가 상승이 생활에 어떤 영향을 준다고 생각하나요?","物价上涨对普通人的生活影响很大。工资没怎么涨，可是菜、油、房租都在涨，大家手里的钱越来越不够用。很多人开始减少外出吃饭和购物，年轻人买房也更难了。我觉得政府应该稳定物价，同时我们自己也要学会理性消费。","월급은 그대로인데 장바구니 물가와 월세가 올라 외식과 쇼핑을 줄이고 내 집 마련도 어려워졌어요. 정부는 물가 안정, 개인은 합리적 소비가 필요해요."],["","你认为一周工作四天可行吗？","주 4일 근무제가 실현 가능하다고 생각하나요?","我认为在一些行业是可行的。工作四天，员工有更多时间休息和陪家人，工作效率反而可能提高。有些国家已经在试行，效果还不错。但是像医院、工厂这样需要一直有人的地方，实行起来就比较难。所以我觉得可以先在部分公司试点，再慢慢推广。","일부 업종은 가능해요. 휴식이 늘면 효율이 오를 수 있고 일부 국가는 시범 운영 중이에요. 병원·공장은 어려우니 시범 도입 후 점차 확대해야 해요."],["","你认为名牌商品值得买吗？","명품을 살 가치가 있다고 생각하나요?","我觉得要看情况。名牌商品质量一般比较好，设计也很精致，用的时间长，从这一点来看是值得的。但是有些人买名牌只是为了面子，甚至借钱去买，这就不太理智了。我认为买东西应该根据自己的经济能力，买适合自己的才是最好的。","상황에 따라 달라요. 품질과 디자인이 좋아 오래 쓰니 가치가 있지만, 체면 때문에 빚까지 지는 건 비합리적이에요. 형편에 맞는 게 최고예요."]],"p6":[["졸업 가운을 입은 내가 휴대폰으로 은사님께 전화하고 있다. 책상에 ‘졸업식 초대장’이 놓여 있다.","你想邀请老师参加你的毕业典礼，请给老师打电话邀请。","선생님을 졸업식에 초대하고 싶어요. 전화로 초대하세요.","李老师，您好！我是您的学生智贤。下周五上午十点学校举行毕业典礼，我特别希望您能来参加。这四年多亏了您的指导，我才能顺利毕业，还找到了工作。如果您有时间的话，典礼结束以后我想请您吃顿饭，表示感谢。","이 선생님, 제자 지현이에요. 다음 주 금요일 10시 졸업식에 꼭 와 주셨으면 해요. 4년간 지도 덕분에 졸업하고 취업도 했어요. 끝나고 감사의 식사를 대접하고 싶어요."],["레스토랑 예약 확인 문자 화면 ‘토요일 18:00 4명’. 나는 전화를 걸고 있다.","你预约了餐厅，但有事要改时间，请给餐厅打电话。","식당을 예약했는데 사정이 생겨 시간을 바꿔야 해요. 식당에 전화하세요.","您好，我姓朴，预约了这个星期六晚上六点，四个人的位子。因为我们有个朋友的飞机晚到了，六点可能赶不上。请问能改到七点半吗？如果七点半没有位子，改到星期天晚上也可以。麻烦您了。","박 씨인데 토요일 6시 4명 예약했어요. 친구 비행기가 늦어 6시는 어려워요. 7시 반으로 바꿀 수 있을까요? 안 되면 일요일 저녁도 괜찮아요."],["아침 회의실. 9시 10분인데 동료 자리만 비어 있고 팀원들이 시계를 보고 있다.","你的同事每天迟到，影响了工作，请你委婉地提醒他。","동료가 매일 지각해서 업무에 지장이 있어요. 완곡하게 주의를 주세요.","小赵，有件事想跟你聊聊，你别介意啊。最近早会开始的时候你经常还没到，大家只好等你，或者会后再跟你重新说一遍，有点儿影响进度。是不是家离得太远，还是早上有什么困难？如果需要的话，我们可以跟部长商量一下，把早会推迟一点儿。","샤오자오, 기분 나빠하지 말고 들어줘. 요즘 아침 회의에 자주 늦어서 다들 기다리거나 다시 설명하느라 진행이 늦어져. 집이 멀어서 그래? 필요하면 부장님께 회의 시간을 늦추자고 상의해 볼게."]]},"10":{"p2":[["나무 가지 위에 작은 새 두 마리가 앉아 있다.","树上有几只鸟？","나무 위에 새가 몇 마리 있나요?","树上有两只鸟。","새가 두 마리 있어요."],["고속도로 표지판. ‘机场 35km’.","从这儿到机场有多远？","여기서 공항까지 얼마나 멀어요?","从这儿到机场有三十五公里。","35킬로미터예요."],["버스 정류장에서 세 사람이 시계를 보며 서 있다.","他们在等什么？","그들은 무엇을 기다리고 있나요?","他们在等公共汽车。","버스를 기다리고 있어요."],["캐리어 두 개 위에 무게 표시. 파란 캐리어 23kg, 회색 캐리어 17kg.","哪个箱子更重？","어느 캐리어가 더 무거워요?","蓝色的箱子更重，比灰色的重六公斤。","파란 캐리어가 6kg 더 무거워요."]],"p3":[["노래방 입구. 동료가 마이크를 들고 묻는다.","你喜欢唱歌吗？","노래 부르는 거 좋아해요?","我唱得不怎么样，但是很喜欢唱。压力大的时候去唱唱歌，心里就痛快多了。","잘 못 부르지만 좋아해요. 스트레스 받을 때 부르면 속이 시원해요."],["월급날 사무실. 친구가 지갑을 흔들며 말한다.","今天我请客，你想吃什么？","오늘 내가 쏠게, 뭐 먹고 싶어?","真的吗？那我们去吃烤肉吧！公司对面新开了一家，听说味道不错。","정말? 그럼 고기 먹으러 가자! 회사 맞은편에 새로 생긴 집이 맛있대."],["중국 지도가 걸린 회의실. 동료가 묻는다.","你去过中国吗？","중국에 가 본 적 있어요?","去过一次，三年前跟公司去上海出差，还顺便去外滩看了夜景。","한 번이요. 3년 전 상하이 출장 때 와이탄 야경도 봤어요."],["카페. 오랜만에 만난 선배가 묻는다.","你最近忙不忙？","요즘 바빠요?","最近挺忙的，公司在准备一个新产品，我几乎每天都加班。","꽤 바빠요. 회사에서 신제품을 준비 중이라 거의 매일 야근해요."],["아파트 현관 인터폰 화면에 택배 기사가 보인다. (나는 집주인)","您好，您的快递到了，放在哪儿？","안녕하세요, 택배 왔는데 어디에 둘까요?","谢谢您！我现在不方便下楼，麻烦您放在门口就行，辛苦了。","감사합니다! 지금 내려가기 어려우니 문 앞에 두시면 돼요. 수고하셨어요."]],"p4":[["","你喜欢运动吗？常做什么运动？","운동을 좋아하나요? 어떤 운동을 자주 하나요?","我很喜欢运动，最常做的是网球。我每个星期二和星期四早上都去小区的网球场打一个小时。打网球不但能锻炼全身，还能认识很多朋友。现在我和一起打球的邻居们成了好朋友，周末还常常一起聚餐。","좋아해요. 화·목 아침마다 단지 테니스장에서 1시간 쳐요. 전신 운동이 되고 친구도 생겨서 이웃들과 주말에 모임도 해요."],["","你周围有没有很特别的人？","주변에 특별한 사람이 있나요?","我的一个同事很特别。他已经五十多岁了，可是对新东西的好奇心比年轻人还强。去年他开始学编程，今年又报名学吉他。他常说：“学习没有年龄限制。”每次看到他，我都觉得自己应该更努力。","50대 동료인데 젊은이보다 호기심이 강해요. 작년엔 코딩, 올해는 기타를 배워요. '배움에 나이 제한은 없다'고 해서 볼 때마다 자극이 돼요."],["","你一般什么时候听音乐？","보통 언제 음악을 듣나요?","我一般在上下班路上听音乐。坐地铁的时候戴上耳机，听着喜欢的歌，就感觉时间过得特别快。另外，晚上做家务的时候我也喜欢放音乐，一边听一边干活，一点儿都不觉得累。","출퇴근길에 이어폰을 끼고 들으면 시간이 금방 가요. 저녁에 집안일할 때도 틀어 놓으면 하나도 안 힘들어요."],["","你送过的最特别的礼物是什么？","지금까지 한 가장 특별한 선물은?","我送过的最特别的礼物是一本相册。去年爸妈结婚三十周年，我把家里从以前到现在的老照片都找出来，一张一张扫描、整理，在每张照片下面写了一句话。妈妈看的时候感动得哭了，说这是她收到的最好的礼物。","앨범이요. 부모님 결혼 30주년에 옛 사진을 모아 스캔하고 사진마다 한마디씩 적었어요. 엄마가 감동해서 우시며 최고의 선물이라고 하셨어요."],["","如果有一天的假期，你想做什么？","하루 휴가가 생긴다면 무엇을 하고 싶나요?","如果有一天的假期，我想一个人去海边。早上坐火车出发，中午在海边的小饭馆吃新鲜的海鲜，下午坐在沙滩上看书、发呆。平时总是忙忙碌碌的，很难有时间安安静静地和自己待一会儿，所以这样的一天对我来说是最好的休息。","혼자 바다에 가고 싶어요. 아침 기차로 출발해 점심엔 해산물, 오후엔 모래사장에서 책 읽고 멍때리기. 평소 바빠서 혼자 조용히 있을 시간이 없거든요."]],"p5":[["","你认为一个国家最重要的竞争力是什么？","한 나라의 가장 중요한 경쟁력은 무엇이라고 생각하나요?","我认为一个国家最重要的竞争力是人才。像韩国这样自然资源不多的国家，经济能发展起来，主要靠的就是教育和人才。有了优秀的人才，才能有新技术、新产业。所以国家应该重视教育投资，同时创造好的环境，留住优秀的人才。","인재예요. 자원이 적은 한국이 발전한 것도 교육과 인재 덕분이에요. 인재가 있어야 신기술과 산업이 생기니 교육 투자와 인재 유치 환경이 중요해요."],["","你觉得直播带货对消费有什么影响？","라이브 커머스가 소비에 어떤 영향을 준다고 보나요?","直播带货让购物变得更直观、更有趣。主播会详细介绍产品，观众可以随时提问，价格往往也比较优惠。但是直播的气氛很热闹，很多人一激动就买了很多不需要的东西。还有一些主播夸大宣传，产品质量没有保证。所以消费者一定要冷静判断。","제품을 직관적으로 보고 질문할 수 있고 가격도 저렴해요. 하지만 분위기에 휩쓸려 충동구매하기 쉽고 과장 광고도 있어 냉정하게 판단해야 해요."],["","你认为老年人应该学习使用智能手机吗？","노인도 스마트폰 사용법을 배워야 한다고 생각하나요?","我认为老年人很有必要学习使用智能手机。现在看病挂号、坐车、买东西，很多都要用手机完成，不会用的话生活会很不方便。而且用手机可以和家人视频聊天，减少孤独感。不过老年人学起来比较慢，子女和社区应该耐心地教他们。","꼭 필요해요. 병원 접수, 교통, 쇼핑을 휴대폰으로 하니 못 쓰면 불편하고, 가족과 영상통화로 외로움도 줄어요. 자녀와 지역사회가 인내심 있게 가르쳐야 해요."],["","你认为铁饭碗现在还存在吗？","평생직장(철밥통)이 지금도 존재한다고 생각하나요?","我认为传统意义上的铁饭碗已经越来越少了。现在技术变化太快，很多行业和公司说没就没了，就连公务员也要不断学习新东西。所以我觉得，真正的铁饭碗不是一份稳定的工作，而是一个人的能力。只要不断提高自己，走到哪儿都不怕找不到工作。","전통적 의미의 철밥통은 줄고 있어요. 기술 변화로 업종이 사라지고 공무원도 계속 배워야 해요. 진짜 철밥통은 직장이 아니라 실력이에요."]],"p6":[["헬스장 안내 데스크. 벽에 ‘회원권 1·3·6개월’ 가격표가 붙어 있고 나는 직원에게 다가가고 있다.","你想在周末去健身房办会员卡，请向工作人员咨询。","헬스장 회원권을 만들려고 해요. 직원에게 문의하세요.","您好，我想办一张会员卡，想先了解一下。你们这儿有一个月、三个月、六个月的卡，价格分别是多少？办卡以后可以免费上团体课吗？另外，我平时只有周末有时间，周末几点开门、几点关门？","회원권을 만들려고 하는데요, 1·3·6개월 가격이 각각 얼마예요? 그룹 수업은 무료인가요? 주말만 되는데 주말 운영 시간은요?"],["메신저 화면. 석 달 전 ‘돈 빌려줘서 고마워, 다음 달에 갚을게’ 메시지가 보인다.","你的朋友把你借给他的钱一直没还，请你委婉地提醒他。","친구가 빌려 간 돈을 계속 안 갚아요. 완곡하게 상기시켜 주세요.","喂，最近怎么样？工作还顺利吧？其实有件事不太好意思开口。三个月前我借给你的那五十万韩元，你还记得吧？我最近要交房租，手头有点儿紧。你方便的话，这个月能先还我一部分吗？如果你也有困难，我们可以商量着来。","요즘 잘 지내? 말 꺼내기 좀 그런데, 석 달 전 빌려준 50만 원 기억하지? 이번에 월세를 내야 해서 좀 빠듯하네. 괜찮으면 이번 달에 일부라도 줄 수 있을까? 어려우면 같이 방법을 찾자."],["피아노 앞에서 남동생이 악보를 덮고 울상을 짓고 있다.","你的弟弟想放弃学钢琴，请你鼓励他。","남동생이 피아노를 그만두려 해요. 격려해 주세요.","怎么了？是不是这首曲子太难了？我小时候学钢琴也想放弃过好几次。但是你想想，你都学了三年了，现在放弃多可惜啊。我们不急，每天先练十五分钟，把难的地方一小段一小段地练。等你学会了这首曲子，我给你买你一直想要的那个乐高。","이 곡이 너무 어려워? 나도 어릴 때 몇 번이나 그만두고 싶었어. 3년이나 배웠는데 아깝잖아. 매일 15분씩 어려운 부분만 조금씩 연습하자. 이 곡 마스터하면 갖고 싶던 레고 사 줄게."]]}};

</script>
<script>
const OPT={ko:false,rate:0.75};
const RATES=[0.5,0.6,0.7,0.75,0.8,0.9,1,1.2];
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
Object.assign(OPT,ls("tsc10_opt")||{});
let checks=ls("tsc10_checks")||{};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const HAS_PY=typeof pinyinPro!=="undefined";
const NUMZH=["","一","二","三","四","五","六","七"];
const MARKS=[["ok","시간 안에 완성"],["short","말이 짧았음"],["stuck","막힘·침묵"]];
let ROUND=1;

function ruby(text){
  if(!HAS_PY)return esc(text);
  try{
    const chars=[...text];
    const pys=pinyinPro.pinyin(text,{type:"array",toneSandhi:true});
    if(pys.length!==chars.length)return esc(text);
    return chars.map((c,i)=>/[一-鿿]/.test(c)?`<ruby>${c}<rt>${esc(pys[i])}</rt></ruby>`:esc(c)).join("");
  }catch(e){return esc(text)}
}

/* 소리 */
let actx=null;
function beep(freq=880,dur=.3){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.18,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.start();o.stop(actx.currentTime+dur)}catch(e){}}
function speak(text,done){
  const ss=window.speechSynthesis;
  if(!ss||typeof SpeechSynthesisUtterance==="undefined"){toast("이 기기에서는 음성 읽기를 쓸 수 없어요.");setTimeout(()=>done&&done(),1500);return}
  try{
    ss.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=OPT.rate;
    const vs=ss.getVoices();const v=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;
    let fired=false;const fin=()=>{if(fired)return;fired=true;clearTimeout(guard);done&&done()};
    const guard=setTimeout(fin,text.length*450+4000);
    u.onend=fin;u.onerror=fin;ss.speak(u);
  }catch(e){done&&done()}
}

const app=document.getElementById("app");
const nav=document.getElementById("nav");
const rounds=document.getElementById("rounds");

function getQ(key){const[r,pi,qi]=key.split("_").map(Number);const m=META[pi];const a=R[r]["p"+m.no][qi];return{p:m,q:{pic:a[0],zh:a[1],ko:a[2],model:a[3],mko:a[4]}}}

function render(){
  stopDrill();
  rounds.innerHTML=Array.from({length:10},(_,i)=>{const r=i+1;const done=countDone(r);return `<button type="button" data-round="${r}" class="rtab${r===ROUND?" on":""}" ${r===ROUND?'aria-current="page"':""}>${r}회${done?`<small>${done}/21</small>`:""}</button>`}).join("");
  nav.innerHTML=META.map(p=>`<button type="button" class="jump" data-jump="part${p.no}">제${p.no}부분 ${p.ko.replace(/\(.*\)/,"")}</button>`).join("");
  let n=0;
  app.innerHTML=`
  <header class="hero">
    <div class="eyebrow">Test of Spoken Chinese · 모의고사 ${ROUND}회</div>
    <h1>TSC 실전 모의고사 ${ROUND}회</h1>
    <p class="muted">원하는 문제를 골라 <b>듣기</b>로 질문을 듣거나, <b>실전 타이머</b>로 질문 → 준비 → 삐 → 답변을 한 문제씩 연습하세요.</p>
    ${HAS_PY?"":`<p class="warn">병음 표기 도구를 불러오지 못해 한자만 표시됩니다. 인터넷 연결 후 새로고침해 주세요.</p>`}
  </header>
  ${META.map((p,pi)=>`
  <section class="part" id="part${p.no}">
    <div class="part-head">
      <h2>제${p.no}부분 ${p.ko} <span class="zh muted" style="font-weight:500;font-size:15px">第${NUMZH[p.no]}部分 ${p.zh}</span></h2>
      <div class="meta">${R[ROUND]["p"+p.no].length}문항 · 준비 <span class="num">${p.prep}</span>초 · 답변 <span class="num">${p.ans}</span>초 — ${p.guide[0]}</div>
    </div>
    ${R[ROUND]["p"+p.no].map((a,qi)=>{n++;const key=ROUND+"_"+pi+"_"+qi;const q={pic:a[0],zh:a[1],ko:a[2],model:a[3],mko:a[4]};const hide=p.no<=3;const pyCls=hide?"":"nopy pyt";return `
    <article class="card" id="c_${key}">
      <div class="qnum">문항 ${n} · 제${p.no}부분 ${qi+1}번</div>
      ${q.pic?`<div class="picture" role="img" aria-label="그림 설명: ${esc(q.pic)}"><span class="lbl">그림 설명</span><div class="desc">${esc(q.pic)}</div></div>`:""}
      ${hide?`<div class="qhidden muted" id="qh_${key}">질문 글자 숨김 · 실전처럼 듣기로 답해 보세요</div><div class="zhline" id="qz_${key}" lang="zh-CN" hidden>${ruby(q.zh)}</div>`:`<div class="zhline ${pyCls}" lang="zh-CN">${ruby(q.zh)}</div>`}
      <div class="ko kot">${esc(q.ko)}</div>
      <div class="row">
        <button class="primary" data-act="listen" data-key="${key}">▶ 듣기</button>
        <button data-act="drill" data-key="${key}">실전 타이머</button>
        ${hide?`<button data-act="reveal" data-key="${key}" aria-pressed="false">한자·병음 보기</button>`:`<button data-act="py" data-key="${key}" aria-pressed="false">병음 보기</button>`}
      </div>
      <div class="drill" id="d_${key}" hidden>
        <div class="status" id="st_${key}" aria-live="polite"></div>
        <div class="timer" style="margin-top:8px">
          <div class="tbox prep" id="tbp_${key}"><div class="t-lbl"><span>준비</span><span class="num">${p.prep}초</span></div><div class="t-val num" id="tvp_${key}">${p.prep}</div><div class="track"><div class="fill" id="tfp_${key}"></div></div></div>
          <div class="tbox ans" id="tba_${key}"><div class="t-lbl"><span>답변</span><span class="num">${p.ans}초</span></div><div class="t-val num" id="tva_${key}">${p.ans}</div><div class="track"><div class="fill" id="tfa_${key}"></div></div></div>
        </div>
        <div class="row" style="margin-top:8px"><button data-act="skip" data-key="${key}">다음 단계</button><button data-act="stop" data-key="${key}">멈추기</button></div>
      </div>
      <details><summary>모범답변 (4~5급 목표)</summary><div class="model">
        <div class="zhline small ${pyCls}" lang="zh-CN">${ruby(q.model)}</div>
        <div class="ko kot">${esc(q.mko)}</div>
        <div class="row"><button class="chip" data-act="say" data-key="${key}">▶ 모범답변 듣기</button></div>
      </div></details>
      <div class="row" role="group" aria-label="자가 체크">
        ${MARKS.map(m=>`<button class="chip" data-act="mark" data-key="${key}" data-v="${m[0]}" aria-pressed="${checks[key]===m[0]}">${m[1]}</button>`).join("")}
      </div>
    </article>`}).join("")}
  </section>`).join("")}
  <div class="row">${ROUND>1?`<button type="button" class="navbtn" data-round="${ROUND-1}">← ${ROUND-1}회</button>`:""}${ROUND<10?`<button type="button" class="navbtn primary" data-round="${ROUND+1}">${ROUND+1}회 →</button>`:""}</div>
  <p class="note">문항 안내: TSC 공식 문항은 YBM 저작물이라 원문을 그대로 싣지 않았습니다. 1회는 온라인 기출 후기·교재에서 반복 확인된 빈출 주제를, 2~10회는 TSC 출제 유형(장소·숫자·동작·비교, 제안·부탁·롤플레이, 습관·경험·소개, 사회 이슈, 거절·문의·위로·항의 등)에 맞춰 겹치지 않는 주제로 구성했습니다. 병음은 자동 변환이라 다음자(多音字)는 드물게 틀릴 수 있어요. 녹음은 휴대폰 녹음 앱과 함께 쓰세요.</p>`;
  applyOpts();
}
function countDone(r){return Object.keys(checks).filter(k=>k.startsWith(r+"_")).length}
function applyOpts(){
  document.getElementById("t_ko").checked=OPT.ko;
  document.querySelectorAll(".kot").forEach(el=>el.hidden=!OPT.ko);
}
function renderRates(){const box=document.getElementById("rates");box.innerHTML=RATES.map(r=>`<button type="button" class="rate" data-rate="${r}" aria-pressed="${Math.abs(r-OPT.rate)<0.001}">${r}×</button>`).join("")}
document.getElementById("rates").addEventListener("click",e=>{const b=e.target.closest("[data-rate]");if(!b)return;OPT.rate=+b.dataset.rate;ls("tsc10_opt",OPT);renderRates();speak("你好，这是现在的语速。")});
renderRates();
document.getElementById("t_ko").onchange=e=>{OPT.ko=e.target.checked;ls("tsc10_opt",OPT);applyOpts()};
nav.addEventListener("click",e=>{const a=e.target.closest("[data-jump]");if(!a)return;e.preventDefault();const el=document.getElementById(a.dataset.jump);el&&el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});

/* 타이머 */
const D={key:null,phase:null,timer:null};
function stopDrill(){
  clearInterval(D.timer);D.timer=null;try{speechSynthesis.cancel()}catch(e){}
  if(D.key){const c=document.getElementById("c_"+D.key);c&&c.classList.remove("active");const d=document.getElementById("d_"+D.key);if(d)d.hidden=true}
  D.key=null;D.phase=null;
}
function setPhase(ph){
  D.phase=ph;const k=D.key;const st=document.getElementById("st_"+k);
  st.textContent={listen:"질문을 듣는 중…",prep:"생각하세요 (준비 시간)",ans:"삐— 지금 답변하세요",end:"답변 시간 종료"}[ph];
  st.className="status "+(ph==="end"?"":ph);
  document.getElementById("tbp_"+k).classList.toggle("on",ph==="prep");
  document.getElementById("tba_"+k).classList.toggle("on",ph==="ans");
}
function countdown(sec,w,next){
  const k=D.key,tv=document.getElementById("tv"+w+"_"+k),tf=document.getElementById("tf"+w+"_"+k),t0=Date.now();
  clearInterval(D.timer);
  D.timer=setInterval(()=>{const el=(Date.now()-t0)/1000,left=Math.max(0,sec-el);tv.textContent=Math.ceil(left);tf.style.width=Math.min(100,el/sec*100)+"%";if(left<=0){clearInterval(D.timer);D.timer=null;next()}},100);
}
function startDrill(key){
  stopDrill();const{p,q}=getQ(key);D.key=key;
  document.getElementById("c_"+key).classList.add("active");document.getElementById("d_"+key).hidden=false;
  ["p","a"].forEach(w=>document.getElementById("tf"+w+"_"+key).style.width="0%");
  document.getElementById("tvp_"+key).textContent=p.prep;document.getElementById("tva_"+key).textContent=p.ans;
  setPhase("listen");
  speak(q.zh,()=>{if(D.key===key&&D.phase==="listen")prep()});
}
function prep(){const{p}=getQ(D.key);setPhase("prep");countdown(p.prep,"p",ans)}
function ans(){const{p}=getQ(D.key);beep(880,.35);document.getElementById("tfp_"+D.key).style.width="100%";document.getElementById("tvp_"+D.key).textContent="0";setPhase("ans");countdown(p.ans,"a",end)}
function end(){beep(520,.3);setPhase("end")}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,act=b.dataset.act;
  if(act==="listen"){if(D.key)stopDrill();speak(getQ(k).q.zh)}
  else if(act==="drill"){beep(1,.01);startDrill(k)}
  else if(act==="say"){if(D.key)stopDrill();speak(getQ(k).q.model)}
  else if(act==="stop")stopDrill();
  else if(act==="reveal"){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);b.textContent=on?"한자·병음 숨기기":"한자·병음 보기";document.getElementById("qz_"+k).hidden=!on;document.getElementById("qh_"+k).hidden=on}
  else if(act==="py"){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);b.textContent=on?"병음 숨기기":"병음 보기";document.querySelectorAll(`#c_${k} .pyt`).forEach(el=>el.classList.toggle("nopy",!on))}
  else if(act==="skip"&&D.key===k){
    if(D.phase==="listen"){try{speechSynthesis.cancel()}catch(e){}prep()}
    else if(D.phase==="prep"){clearInterval(D.timer);ans()}
    else if(D.phase==="ans"){clearInterval(D.timer);end()}
    else startDrill(k);
  }
  else if(act==="mark"){
    const v=b.dataset.v;if(checks[k]===v)delete checks[k];else checks[k]=v;ls("tsc10_checks",checks);
    document.querySelectorAll(`[data-act="mark"][data-key="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",checks[k]===x.dataset.v));
    const tab=rounds.querySelector(".rtab.on");if(tab){const d=countDone(ROUND);tab.innerHTML=`${ROUND}회${d?`<small>${d}/21</small>`:""}`}
  }
});
let tt;function toast(m){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="note";el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;z-index:20";document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2500)}

function goRound(r){r=Math.min(10,Math.max(1,r|0||1));ROUND=r;render();window.scrollTo(0,0);try{history.replaceState(null,"","#r"+r)}catch(e){}}
function route(){let h="";try{h=location.hash}catch(e){}const m=/^#r(\d+)$/.exec(h);const r=m?+m[1]:1;if(r!==ROUND||!app.innerHTML)goRound(r)}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{const b=e.target.closest("[data-round]");if(!b)return;e.preventDefault();goRound(+b.dataset.round)});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
route();
</script>
</body>
</html>
