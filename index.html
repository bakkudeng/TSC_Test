a: "我更支持前者。\n首先，从效率和现代社会发展的角度来看，这种方式能为我们节省大量的时间和成本，更加符合快节奏的生活需求。\n其次，它拥有更高的灵活性和自主性，能够更好地满足现代人多元化的个性需求。\n虽然另一种观点也有其独特的优势和人情味，但是在实际应用中效率相对较低。\n因此综合权衡，我认为前者是更加符合时代趋势的理性选择。",
pinyinA: "Wǒ gèng zhīchí qiánzhě.\nShǒuxiān, cóng xiàolǜ hé xiàndài shèhuì fāzhǎn de jiǎodù lái kàn, zhè zhǒng fāngshì néng wèi wǒmen jiéshěng dàliàng de shíjiān hé chéngběn, gèngjiā fúhé kuài jiézòu de shēnghuó xūqiú.\nQícì, tā yōngyǒu gèng gāo de línghuóxìng hé zìzhǔxìng, nénggòu gèng hǎo de mǎnzú xiàndàirén duōyuánhuà de gèxìng xūqiú.\nSuīrán lìng yì zhǒng guāndiǎn yě yǒu qí dútè de yōushì hé rénqíngwèi, dànshì zài shíjì yìngyòng zhōng xiàolǜ xiāngduì jiàodī.\nYīncǐ zōnghé quánhéng, wǒ rènwéi qiánzhě shì gèngjiā fúhé shídài qūshì de lǐxìng xuǎnzé.",
transA: "저는 전자를 더 지지합니다. 첫째, 효율과 현대 사회 관점에서 시간과 비용을 크게 절감해 빠른 삶의 템포에 부합합니다. 둘째, 유연성과 자율성이 높아 다양한 개별 요구를 충족합니다. 비록 후자도 장점이 있지만 실제 효율은 다소 떨어집니다. 따라서 종합적으로 전자가 시대 흐름에 맞는 합리적 선택입니다.",
tip: "양자택일 논제에서 '我更支持前者(전자 지지)'로 서두를 열고 5단 논법을 전개하세요."
},

pinyinQ: Nǐ duì “${theme.p5[1].py}” chí shénme tàidu? Qǐng chǎnshù nǐ de lǐyóu.,
transQ: "${theme.p5[1].ko}"에 대해 어떤 입장이신가요? 이유를 밝혀보세요.,
a: "我对这个问题持积极支持的态度。\n第一，这是科技进步和社会发展的必然结果，能够极大提高整体运作效率，推动社会创新。\n第二，对于个人而言，这种模式有助于提升生活便利度，打破传统限制，拓展更多可能性。\n当然，在推进的过程中也需要建立完善的制度和规范，防范潜在的风险。\n所以只要管理得当，这种发展趋势是非常值得肯定和推广的。",
pinyinA: "Wǒ duì zhège wèntí chí jījí zhīchí de tàidu.\nDì-yī, zhè shì kējì jìnbù hé shèhuì fāzhǎn de bìrán jiéguǒ, nénggòu jídà tígāo zhěngtǐ yùnzuò xiàolǜ, tuīdòng shèhuì chuàngxīn.\nDì-èr, duìyú gèrén ér yán, zhè zhǒng móshì yǒuzhùyú tíshēng shēnghuó biànlìdù, dǎpò chuántǒng xiànzhì, tuòzhǎn gèng duō kěnéngxìng.\nDāngrán, zài tuījìn de guòchéng zhōng yě xūyào jiànlì wánshàn de zhìdù hé guīfàn, fángfàn qiánzài de fēngxiǎn.\nSuǒyǐ zhǐyào guǎnlǐ dédàng, zhè zhǒng fāzhǎn qūshì shì fēicháng zhídé kěndìng hé tuīguǎng de.",
transA: "저는 이에 대해 적극 찬성하는 입장입니다. 첫째, 기술 진보와 사회 발전의 필연적 결과이며 전반적 효율을 높이고 혁신을 촉진합니다. 둘째, 개인에게 편리함을 주고 한계를 넘어 가능성을 넓혀줍니다. 물론 위험을 막는 제도적 보완도 필요합니다. 따라서 적절한 관리 아래 추진된다면 충분히 긍정적입니다.",
tip: "사회·기술 찬반형 논제에 '必然结果(필연적 결과)', '极大提高效率(효율 극대화)'는 최고 득점용 표현입니다."
}
];

let osc = webAudioCtx.createOscillator(), gain = webAudioCtx.createGain();

gain.gain.setValueAtTime(0.2, webAudioCtx.currentTime);

} catch(e) {}
}

if(isO) { let pEl = b.querySelector('.ans-pinyin'), kEl = b.querySelector('.ans-korean'); if(pEl) pEl.classList.remove('hidden'); if(kEl) kEl.classList.remove('hidden'); }
if(l) l.textContent = isO ? '모범 답안 닫기' : '모범 답안 열기'; setLucideIcon(ic, isO ? 'eye-off' : 'eye', 'w-3.5 h-3.5 text-indigo-600'); lucide.createIcons();
}
​function playTTS(text, elementId, btnEl) {
if (!('speechSynthesis' in window)) return showToast("브라우저가 TTS를 지원하지 않습니다.");
if (window.speechSynthesis.speaking && currentSpeakingId === elementId) return stopTTS();
stopTTS();
let utter = new SpeechSynthesisUtterance(text); utter.lang = 'zh-CN'; utter.rate = globalSpeed;
let cnVoice = window.speechSynthesis.getVoices().find(v => v.lang && (v.lang.includes('zh') || v.lang.includes('cmn')));
if (cnVoice) utter.voice = cnVoice;
currentSpeakingId = elementId;
if (btnEl) { btnEl.classList.add('ring-2', 'ring-rose-500', '!bg-rose-600', '!text-white'); let ic = btnEl.querySelector('.tts-icon-wrap'); setLucideIcon(ic, 'square', elementId.startsWith('a_') ? 'w-3 h-3' : 'w-3.5 h-3.5'); lucide.createIcons(); }
utter.onend = () => { resetTTSButtons(); currentSpeakingId = null; }; utter.onerror = utter.onend;
activeUtterance = utter; window.speechSynthesis.speak(utter);
}
function stopTTS() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); resetTTSButtons(); currentSpeakingId = null; }
function resetTTSButtons() {
document.querySelectorAll('.tts-btn').forEach(b => { b.classList.remove('ring-2', 'ring-rose-500', '!bg-rose-600', '!text-white'); let ic = b.querySelector('.tts-icon-wrap'); setLucideIcon(ic, 'volume-2', b.textContent.includes('답변') ? 'w-3 h-3' : 'w-3.5 h-3.5'); });
lucide.createIcons();
}
​function triggerTimer(id, duration) {
if (timerInterval) { clearInterval(timerInterval); if (activeTimerId) { let oldBox = document.getElementById(timerBox_${activeTimerId}); if (oldBox) oldBox.classList.add('hidden'); } }
activeTimerId = id; let box = document.getElementById(timerBox_${id}), text = document.getElementById(timerText_${id}), bar = document.getElementById(timerProgress_${id});
if (!box || !text || !bar) return;
box.classList.remove('hidden'); playTone(880, 0.2, 'sine');
let tLeft = duration, tTotal = duration; text.textContent = ${tLeft}초; bar.style.width = '100%';
timerInterval = setInterval(() => {
tLeft--; bar.style.width = ${Math.max(0, (tLeft/tTotal)*100)}%; text.textContent = ${tLeft}초;
if (tLeft === 3) playTone(660, 0.15, 'sine');
if (tLeft <= 0) { clearInterval(timerInterval); timerInterval = null; text.textContent = '답변 종료!'; playTone(440, 0.5, 'triangle'); setTimeout(() => box.classList.add('hidden'), 1500); }
}, 1000);
}
​function showToast(msg) {
let t = document.createElement('div'); t.className = "fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-lg shadow-lg border border-slate-700"; t.textContent = msg;
document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
​window.addEventListener('DOMContentLoaded', () => {
renderApp(); if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
});
</script>
