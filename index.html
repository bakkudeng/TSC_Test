<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>삼성 사내 TSC 실전 모의고사 10세트 완성판</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

.font-chinese { font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
button { touch-action: manipulation; }
.no-scrollbar::-webkit-scrollbar { display: none; }

</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col pb-12">
<!-- Sticky Mobile-First Navigation Bar -->
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
<div class="max-w-4xl mx-auto px-3 sm:px-4 py-2.5 flex items-center justify-between gap-2">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-blue-700 text-white font-black text-sm flex items-center justify-center shrink-0 shadow-sm">TSC</div>
<div class="relative">
<select id="setSelector" onchange="changeSet(this.value)" class="text-xs sm:text-sm font-bold bg-slate-100 border border-slate-300 rounded-lg py-1.5 pl-2.5 pr-7 text-slate-900 focus:ring-2 focus:ring-blue-600 focus:outline-none appearance-none cursor-pointer">
<option value="1">제 01 세트 (14문항)</option>
<option value="2">제 02 세트 (14문항)</option>
<option value="3">제 03 세트 (14문항)</option>
<option value="4">제 04 세트 (14문항)</option>
<option value="5">제 05 세트 (14문항)</option>
<option value="6">제 06 세트 (14문항)</option>
<option value="7">제 07 세트 (14문항)</option>
<option value="8">제 08 세트 (14문항)</option>
<option value="9">제 09 세트 (14문항)</option>
<option value="10">제 10 세트 (14문항)</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-1.5 text-slate-500"><i data-lucide="chevron-down" class="w-4 h-4"></i></div>
</div>
</div>
<div class="flex items-center gap-1 sm:gap-2">
<div class="flex items-center bg-slate-100 rounded-lg p-0.5 border border-slate-200">
<button onclick="setSpeed(0.75)" class="speed-btn px-1.5 sm:px-2 py-1 text-[11px] sm:text-xs font-semibold rounded text-slate-600 hover:text-slate-900" data-speed="0.75">0.75x</button>
<button onclick="setSpeed(0.9)" class="speed-btn px-1.5 sm:px-2 py-1 text-[11px] sm:text-xs font-semibold rounded text-slate-600 hover:text-slate-900" data-speed="0.9">0.9x</button>
<button onclick="setSpeed(1.0)" class="speed-btn px-1.5 sm:px-2 py-1 text-[11px] sm:text-xs font-bold rounded bg-blue-600 text-white shadow-sm" data-speed="1.0">1.0x</button>
<button onclick="setSpeed(1.2)" class="speed-btn px-1.5 sm:px-2 py-1 text-[11px] sm:text-xs font-semibold rounded text-slate-600 hover:text-slate-900" data-speed="1.2">1.2x</button>
</div>
<button onclick="stopTTS()" title="오디오 즉시 정지" class="p-1.5 rounded-lg text-slate-500 hover:text-rose-600 hover:bg-rose-50 transition-colors"><i data-lucide="square" class="w-4 h-4"></i></button>
</div>
</div>
<div class="border-t border-slate-200/80 bg-white">
<div class="max-w-4xl mx-auto px-3 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar py-1.5 text-xs">
<div class="flex items-center gap-1 shrink-0" id="partTabs">
<button onclick="filterPart('all')" class="tab-btn px-2.5 py-1 rounded-lg font-bold bg-blue-50 text-blue-700 border border-blue-200 shadow-sm whitespace-nowrap" data-part="all">전체 문항</button>
<button onclick="filterPart('part2')" class="tab-btn px-2.5 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap" data-part="part2">2부분 (상황·6초)</button>
<button onclick="filterPart('part3')" class="tab-btn px-2.5 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap" data-part="part3">3부분 (대화·15초)</button>
<button onclick="filterPart('part4')" class="tab-btn px-2.5 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap" data-part="part4">4부분 (화제·25초)</button>
<button onclick="filterPart('part5')" class="tab-btn px-2.5 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap" data-part="part5">5부분 (논리·50초)</button>
</div>
</div>
</div>
<div class="bg-slate-50 border-t border-slate-200 px-3 py-1.5 text-xs">
<div class="max-w-4xl mx-auto flex items-center justify-between gap-1 sm:gap-2">
<span class="text-slate-400 font-medium text-[11px] hidden lg:inline">일괄 제어</span>
<div class="flex items-center gap-1 sm:gap-1.5 w-full lg:w-auto justify-end flex-wrap sm:flex-nowrap">
<button onclick="toggleAllQuestionText()" id="btnGlobalQ" class="flex-1 sm:flex-none px-2 py-1 rounded-md border border-slate-300 bg-white text-slate-700 font-semibold text-[11px] flex items-center justify-center gap-1 shadow-sm active:bg-slate-100"><i data-lucide="ear" class="w-3 h-3 text-rose-500"></i><span id="labelGlobalQ">2·3부 질문 열기</span></button>
<button onclick="toggleAllQuestionPinyin()" id="btnGlobalQPinyin" class="flex-1 sm:flex-none px-2 py-1 rounded-md border border-slate-300 bg-white text-slate-700 font-semibold text-[11px] flex items-center justify-center gap-1 shadow-sm active:bg-slate-100"><i data-lucide="languages" class="w-3 h-3 text-amber-500"></i><span id="labelGlobalQPinyin">문제 병음 전체 가림</span></button>
<button onclick="toggleAllPinyin()" id="btnGlobalPinyin" class="flex-1 sm:flex-none px-2 py-1 rounded-md border border-slate-300 bg-white text-slate-700 font-semibold text-[11px] flex items-center justify-center gap-1 shadow-sm active:bg-slate-100"><i data-lucide="type" class="w-3 h-3 text-blue-500"></i><span id="labelGlobalPinyin">병음 전체 숨기기</span></button>
<button onclick="toggleAllKorean()" id="btnGlobalKorean" class="flex-1 sm:flex-none px-2 py-1 rounded-md border border-slate-300 bg-white text-slate-700 font-semibold text-[11px] flex items-center justify-center gap-1 shadow-sm active:bg-slate-100"><i data-lucide="file-text" class="w-3 h-3 text-emerald-500"></i><span id="labelGlobalKorean">해석 보기</span></button>
<button onclick="toggleAllAnswers()" id="btnGlobalAns" class="flex-1 sm:flex-none px-2 py-1 rounded-md border border-slate-300 bg-white text-slate-700 font-semibold text-[11px] flex items-center justify-center gap-1 shadow-sm active:bg-slate-100"><i data-lucide="eye" class="w-3 h-3 text-indigo-500"></i><span id="labelGlobalAns">답안 전체 열기</span></button>
</div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 max-w-4xl w-full mx-auto px-3 sm:px-4 py-4 space-y-4">
<div class="bg-gradient-to-r from-slate-900 to-blue-950 text-white rounded-xl p-3.5 sm:p-4 shadow-sm border border-slate-800">
<div class="flex items-center justify-between">
<div>
<div class="flex items-center gap-2">
<span class="text-xs font-bold text-amber-400 bg-amber-400/20 px-2 py-0.5 rounded-full" id="bannerSetLabel">SET 01</span>
<span class="text-xs text-slate-300" id="bannerTotalCount">총 14문항 구성</span>
</div>
<h2 class="text-base sm:text-lg font-bold mt-1" id="bannerTitle">삼성 사내 TSC 실전 모의고사 1회</h2>
<p class="text-xs text-slate-300 mt-0.5" id="bannerDesc">2·3부분은 음성을 먼저 듣고 말해보고, 4·5부분은 한자 문제를 확인한 뒤 실전 타이머에 맞춰 구술하세요.</p>
</div>
<div class="hidden sm:block text-right shrink-0">
<span class="text-[11px] text-slate-400 block">목표 수준</span>
<span class="text-sm font-bold text-emerald-400">사내 4급 ~ 6급</span>
</div>
</div>
</div>
<div id="questionsContainer" class="space-y-4"></div>
</main>
<script>
const allTscSets = {
1: [
{ id: "s1_p2_1", part: "part2", partName: "제2부분: 그림 보고 답하기", respTime: 6, topic: "시간 (8:45)", visualDesc: "벽시계의 시침이 8과 9 사이를 가리키고, 분침이 9(45분)를 가리켜 '8시 45분'을 나타내는 상황", q: "现在几点？", pinyinQ: "Xiànzài jǐ diǎn?", transQ: "지금 몇 시입니까?", a: "现在八点四十五分。（现在差一刻九点。）", pinyinA: "Xiànzài bā diǎn sìshíwǔ fēn. (Xiànzài chà yí kè jiǔ diǎn.)", transA: "지금은 8시 45분입니다. (9시 15분 전입니다.)", tip: "시간을 묻는 질문입니다. '几点' 자리에 '八点四十五分'을 정확히 넣으세요." },
{ id: "s1_p2_2", part: "part2", partName: "제2부분: 그림 보고 답하기", respTime: 6, topic: "위치 (책상 위 핸드폰)", visualDesc: "사무실 책상 위에 스마트폰과 노트북이 나란히 놓여 있는 상황", q: "手机在桌子上吗？", pinyinQ: "Shǒujī zài zhuōzi shang ma?", transQ: "핸드폰이 책상 위에 있습니까?", a: "是的，手机在桌子上。", pinyinA: "Shì de, shǒujī zài zhuōzi shang.", transA: "네, 핸드폰은 책상 위에 있습니다.", tip: "존재 유무나 위치를 묻는 단문입니다. '是的' 후 주어+在+위치로 답합니다." },
{ id: "s1_p2_3", part: "part2", partName: "제2부분: 그림 보고 답하기", respTime: 6, topic: "동작 (달리기)", visualDesc: "공원 산책로에서 한 남자가 편한 운동복 차림으로 조깅(달리기)을 하고 있는 상황", q: "他在做什么？", pinyinQ: "Tā zài zuò shénme?", transQ: "그는 무엇을 하고 있습니까?", a: "他在跑步呢。", pinyinA: "Tā zài pǎobù ne.", transA: "그는 달리기(조깅)를 하고 있습니다.", tip: "진행형 '在 + 동사 (呢)' 구조로 신속하게 단문 답변을 완성합니다." },
{ id: "s1_p2_4", part: "part2", partName: "제2부분: 그림 보고 답하기", respTime: 6, topic: "수량 (사과 5개)", visualDesc: "원형 바구니 안에 빨간 사과가 총 5개 담겨 있는 상황", q: "这里有几个苹果？", pinyinQ: "Zhèlǐ yǒu jǐ ge píngguǒ?", transQ: "여기에 사과가 몇 개 있습니까?", a: "这里有五个苹果。", pinyinA: "Zhèlǐ yǒu wǔ ge píngguǒ.", transA: "여기에 사과가 5개 있습니다.", tip: "숫자 5(五)와 개수 양사(个)의 정확한 발음이 핵심입니다." },
{ id: "s1_p3_1", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "퇴근 후 식사 제안", q: "今天下班以后，一起去吃火锅怎么样？", pinyinQ: "Jīntiān xiàbān yǐhòu, yìqǐ qù chī huǒguō zěnmeyàng?", transQ: "오늘 퇴근하고 같이 훠궈 먹으러 갈래요?", a: "对不起，今天晚上我有别的安排。我们改天再去吧，我请客！", pinyinA: "Duìbuqǐ, jīntiān wǎnshang wǒ yǒu bié de ānpái. Wǒmen gǎitiān zài qù ba, wǒ qǐngkè!", transA: "죄송해요, 오늘 저녁엔 약속이 있어요. 우리 다음에 다시 가요, 제가 살게요!", tip: "정중한 거절 + 이유(별도 일정) + 다음 기약(改天) 조합은 만능입니다." },
{ id: "s1_p3_2", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "주말 여가 활동", q: "你平时周末一般怎么过？", pinyinQ: "Nǐ píngshí zhōumò yībān zěnme guò?", transQ: "평소 주말에 보통 어떻게 보내세요?", a: "我平时周末喜欢在家好好休息，有时候也会和朋友一起去运动。", pinyinA: "Wǒ píngshí zhōumò xǐhuan zài jiā hǎohāo xiūxi, yǒushíhou yě huì hé péngyou yìqǐ qù yùndòng.", transA: "저는 평소 주말에 집에서 푹 쉬거나, 가끔 친구와 운동하러 가요.", tip: "'喜欢在家休息 + 有时候也会~' 패턴으로 15초를 채우세요." },
{ id: "s1_p3_3", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "출퇴근 교통수단", q: "你每天怎么去公司上班？", pinyinQ: "Nǐ měitiān zěnme qù gōngsī shàngbān?", transQ: "매일 회사에 어떻게 출근하세요?", a: "我一般坐地铁去上班。坐地铁不仅很方便，而且从来不堵车。", pinyinA: "Wǒ yībān zuò dìtiě qù shàngbān. Zuò dìtiě bùjǐn hěn fāngbiàn, érqiě cónglái bù dǔchē.", transA: "저는 보통 지하철을 타고 출근해요. 편리할 뿐만 아니라 차가 안 막히거든요.", tip: "‘不仅...而且...’ 점층 접속사를 써서 유창성을 보여주세요." },
{ id: "s1_p3_4", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "점심 메뉴 고르기", q: "今天中午你想吃什么？", pinyinQ: "Jīntiān zhōngwǔ nǐ xiǎng chī shénme?", transQ: "오늘 점심 뭐 먹고 싶어요?", a: "今天天气有点儿冷，我们去吃热热的汤面怎么样？", pinyinA: "Jīntiān tiānqì yǒudiǎnr lěng, wǒmen qù chī rèrè de tāngmiàn zěnmeyàng?", transA: "오늘 날씨가 좀 쌀쌀하니, 따뜻한 국수 먹으러 가는 건 어때요?", tip: "상황(날씨가 춥다)을 언급하고 역제안(~怎么样？)으로 마무리합니다." },
{ id: "s1_p3_5", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "내일 날씨와 우산", q: "明天天气怎么样？需要带雨伞吗？", pinyinQ: "Míngtiān tiānqì zěnmeyàng? Xūyào dài yǔsǎn ma?", transQ: "내일 날씨 어때요? 우산 챙겨야 하나요?", a: "我看了天气预报，明天是晴天，不会下雨，不用带雨伞。", pinyinA: "Wǒ kànle tiānqì yùbào, míngtiān shì qíngtiān, bú huì xiàyǔ, búyòng dài yǔsǎn.", transA: "일기예보를 봤는데 내일 맑대요, 비 안 오니 우산 안 챙겨도 돼요.", tip: "'我看了天气预报'를 도입구로 사용하면 시간을 벌기 좋습니다." },
{ id: "s1_p4_1", part: "part4", partName: "제4부분: 일상 화제 및 생각 표현", respTime: 25, topic: "스트레스 해소법", q: "你有压力的时候，一般怎么减压？", pinyinQ: "Nǐ yǒu yālì de shíhou, yībān zěnme jiǎnyā?", transQ: "스트레스를 받을 때 보통 어떻게 푸나요?", a: "我有压力的时候，一般喜欢去跑步。因为运动的时候我可以出很多汗，心情会变得很轻松。而且跑步不仅对身体好，还能让我忘掉烦恼。所以运动是我最好的减压方法。", pinyinA: "Wǒ yǒu yālì de shíhou, yībān xǐhuan qù pǎobù. Yīnwèi yùndòng de shíhou wǒ kěyǐ chū hěn duō hàn, xīnqíng huì biànde hěn qīngsōng. Érqiě pǎobù bùjǐn duì shēntǐ hǎo, hái néng ràng wǒ wàngdiào fánnǎo. Suǒyǐ yùndòng shì wǒ zuì hǎo de jiǎnyā fāngfǎ.", transA: "저는 스트레스가 있으면 주로 달리기를 합니다. 땀을 푹 흘리면 기분이 편안해지기 때문입니다. 달리기는 건강에도 좋고 고민도 잊게 해줍니다. 따라서 운동은 최고의 스트레스 해소법입니다.", tip: "결론 - 이유1(땀 흘림) - 이유2(건강/고민 망각) - 요약 4단 구조입니다." },
{ id: "s1_p4_2", part: "part4", partName: "제4부분: 일상 화제 및 생각 표현", respTime: 25, topic: "가장 좋아하는 계절", q: "你最喜欢哪个季节？为什么？", pinyinQ: "Nǐ zuì xǐhuan nǎge jìjié? Wèishénme?", transQ: "어떤 계절을 가장 좋아하며 이유는 무엇인가요?", a: "我最喜欢的季节是秋天。因为秋天的天气不冷也不热，非常舒服。而且秋天的风景很漂亮，树叶都变红了。我很喜欢在秋天散步，所以我最喜欢秋天。", pinyinA: "Wǒ zuì xǐhuan de jìjié shì qiūtiān. Yīnwèi qiūtiān de tiānqì bù lěng yě bú rè, fēicháng shūfu. Érqiě qiūtiān de fēngjǐng hěn piàoliang, shùyè dōu biàn hóng le. Wǒ hěn xǐhuan zài qiūtiān sànbù, suǒyǐ wǒ zuì xǐhuan qiūtiān.", transA: "제가 가장 좋아하는 계절은 가을입니다. 춥지도 덥지도 않아 쾌적하기 때문입니다. 게다가 가을 풍경은 예쁘고 단풍이 듭니다. 가을에 산책하는 것을 좋아해서 가을을 가장 선호합니다.", tip: "'不冷也不热', '风景很漂亮'는 계절 표현의 필수 암기구입니다." },
{ id: "s1_p4_3", part: "part4", partName: "제4부분: 일상 화제 및 생각 표현", respTime: 25, topic: "휴가 여행지", q: "如果有长假，你最想去哪里旅行？", pinyinQ: "Rúguǒ yǒu chángjià, nǐ zuì xiǎng qù nǎlǐ lǚxíng?", transQ: "긴 휴가가 있다면 어디로 여행 가고 싶나요?", a: "如果有长假，我最想去海边旅行。因为看大海可以让我的心情变得很平静。而且海边有很多好吃的海鲜，还可以吹海风。如果能和家人一起去放松一下，一定会很开心。", pinyinA: "Rúguǒ yǒu chángjià, wǒ zuì xiǎng qù hǎibiān lǚxíng. Yīnwèi kàn dàhǎi kěyǐ ràng wǒ de xīnqíng biànde hěn píngjìng. Érqiě hǎibiān yǒu hěn duō hǎochī de hǎixiān, hái kěyǐ chuī hǎifēng. Rúguǒ néng hé jiārén yìqǐ qù fàngsōng yíxià, yídìng huì hěn kāixīn.", transA: "긴 휴가가 생긴다면 바다로 가고 싶습니다. 바다를 보면 마음이 차분해지기 때문입니다. 맛있는 해산물도 많고 바닷바람도 쐴 수 있습니다. 가족과 힐링할 수 있다면 참 좋을 것입니다.", tip: "바다(海边)를 테마로 시각 힐링과 먹거리를 함께 설명하세요." },
{ id: "s1_p5_1", part: "part5", partName: "제5부분: 논리적 의견 진술 및 비교", respTime: 50, topic: "온라인 쇼핑 vs 백화점 쇼핑", q: "你更喜欢网上购物还是去商场购物？请说明原因。", pinyinQ: "Nǐ gèng xǐhuan wǎngshang gòuwù háishì qù shāngchǎng gòuwù? Qǐng shuōmíng yuányīn.", transQ: "온라인 쇼핑과 매장 방문 쇼핑 중 무엇을 더 선호하며 이유는 무엇인가요?", a: "我更喜欢网上购物。\n首先，网上购物非常方便，只要有一台手机，随时随地都可以买东西，节省了很多时间。\n其次，网上的商品种类非常丰富，而且价格通常比实体店更便宜，容易比较价格。\n虽然去商场可以直接看实物，但是现代的网购配送非常快，退换货也很容易。\n因此，考虑到时间和效率，我平时更喜欢网上购物。", pinyinA: "Wǒ gèng xǐhuan wǎngshang gòuwù.\nShǒuxiān, wǎngshang gòuwù fēicháng fāngbiàn, zhǐyào yǒu yì tái shǒujī, suíshí suídì dōu kěyǐ mǎi dōngxi, jiéshěngle hěn duō shíjiān.\nQícì, wǎngshang de shāngpǐn zhǒnglèi fēicháng fēngfù, érqiě jiàgé tōngcháng bǐ shítǐdiàn gèng piányi, róngyì bǐjiào jiàgé.\nSuīrán qù shāngchǎng kěyǐ zhíjiē kàn shíwù, dànshì xiàndài de wǎnggòu pèisòng fēicháng kuài, tuìhuànhuò yě hěn róngyì.\nYīncǐ, kǎolǜ dào shíjiān hé xiàolǜ, wǒ píngshí gèng xǐhuan wǎngshang gòuwù.", transA: "저는 온라인 쇼핑을 더 선호합니다. 첫째로 휴대폰만 있으면 언제 어디서나 구매할 수 있어 시간을 절약합니다. 둘째로 상품 종류가 풍부하고 가격 비교가 쉽습니다. 비록 매장에선 실물을 보지만 배송과 반품이 편리합니다. 따라서 시간과 효율상 온라인 쇼핑을 선호합니다.", tip: "50초 발화는 [입장 표명 - 首先 - 其次 - 虽然...但是 - 因此] 5단계 뼈대를 유지하세요." },
{ id: "s1_p5_2", part: "part5", partName: "제5부분: 논리적 의견 진술 및 비교", respTime: 50, topic: "재택근무 vs 사무실 출근", q: "你支持在家办公还是去公司办公室办公？为什么？", pinyinQ: "Nǐ zhīchí zài jiā bàngōng háishì qù gōngsī bàngōngshì bàngōng? Wèishénme?", transQ: "재택근무와 회사 출근 중 어느 쪽을 지지하며 그 이유는 무엇인가요?", a: "我更支持去公司办公室办公。\n第一，在办公室办公沟通效率更高。遇到问题的时候，可以马上和同事面对面交流，更快地解决问题。\n第二，办公室的工作环境更有利于集中注意力，把工作和生活分开。\n虽然在家办公可以节省上下班的时间，但有时候沟通不太方便，容易影响工作效率。\n所以综合来看，我认为去公司办公的效果更好。", pinyinA: "Wǒ gèng zhīchí qù gōngsī bàngōngshì bàngōng.\nDì-yī, zài bàngōngshì bàngōng gōutōng xiàolǜ gèng gāo. Yùdào wèntí de shíhou, kěyǐ mǎshàng hé tóngshì miànduìmiàn jiāoliú, gèng kuài de jiějué wèntí.\nDì-èr, bàngōngshì de gōngzuò huánjìng gèng yǒulìyú jízhōng zhùyìlì, bǎ gōngzuò hé shēnghuó fēnkāi.\nSuīrán zài jiā bàngōng kěyǐ jiéshěng shàng-xiàbān de shíjiān, dàn yǒushíhou gōutōng bú tài fāngbiàn, róngyì yǐngxiǎng gōngzuò xiàolǜ.\nSuǒyǐ zōnghé lái kàn, wǒ rènwéi qù gōngsī bàngōng de xiàoguǒ gèng hǎo.", transA: "저는 회사 출근 근무를 더 지지합니다. 첫째, 즉각 대면 소통으로 문제 해결이 빠릅니다. 둘째, 집중 환경이 좋아 일과 생활을 분리할 수 있습니다. 비록 재택근무가 출퇴근 시간을 아끼지만 소통이 불편할 때가 있습니다. 종합하면 회사 출근이 더 효과적입니다.", tip: "소통 효율(沟通效率), 공사 분리(工作和生活分开) 등의 비즈니스 표현을 활용하세요." }
],

{ id: "s2_p2_1", part: "part2", partName: "제2부분: 그림 보고 답하기", respTime: 6, topic: "날짜 달력 (5월 12일)", visualDesc: "달력에 '5월 12일'(금요일, 星期五) 날짜가 붉은 헤더와 함께 인쇄되어 있는 상황", q: "今天几月几号？", pinyinQ: "Jīntiān jǐ yuè jǐ hào?", transQ: "오늘은 몇 월 며칠입니까?", a: "今天五月十二号。", pinyinA: "Jīntiān wǔ yuè shí'èr hào.", transA: "오늘은 5월 12일입니다.", tip: "날짜를 묻는 패턴입니다. '五月十二号'를 명확하게 발음하세요." },
{ id: "s2_p2_2", part: "part2", partName: "제2부분: 그림 보고 답하기", respTime: 6, topic: "장소 (카페 음료)", visualDesc: "카페 테이블 위에 김이 모락모락 피어오르는 따뜻한 커피 한 잔이 놓여 있는 상황", q: "杯子里是什么？", pinyinQ: "Bēizi li shì shénme?", transQ: "컵 안에는 무엇이 있습니까?", a: "杯子里是热咖啡。", pinyinA: "Bēizi li shì rè kāfēi.", transA: "컵 안에는 따뜻한 커피가 있습니다.", tip: "‘杯子里是 + 음료 명칭’ 형태로 답합니다." },
{ id: "s2_p2_3", part: "part2", partName: "제2부분: 그림 보고 답하기", respTime: 6, topic: "동작 (책 읽기)", visualDesc: "의자에 앉아 책을 펼쳐 들고 독서에 집중하고 있는 여성의 모습", q: "她在做什么？", pinyinQ: "Tā zài zuò shénme?", transQ: "그녀는 무엇을 하고 있습니까?", a: "她在看书呢。", pinyinA: "Tā zài kànshū ne.", transA: "그녀는 책을 읽고 있습니다.", tip: "‘在看书(呢)’로 군더더기 없이 정확히 답합니다." },
{ id: "s2_p2_4", part: "part2", partName: "제2부분: 그림 보고 답하기", respTime: 6, topic: "수량 (책 3권)", visualDesc: "책상 위에 파란색, 초록색, 주황색 책 세 권이 가지런히 포개져 있는 상황", q: "桌子上有几本书？", pinyinQ: "Zhuōzi shang yǒu jǐ běn shū?", transQ: "책상 위에 책이 몇 권 있습니까?", a: "桌子上有三本书。", pinyinA: "Zhuōzi shang yǒu sān běn shū.", transA: "책상 위에 책 세 권이 있습니다.", tip: "책의 양사 '本(běn)'을 정확히 써야 감점이 없습니다." },
{ id: "s2_p3_1", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "주말 운동 제안", q: "这个周末我们一起去打羽毛球，好吗？", pinyinQ: "Zhè ge zhōumò wǒmen yìqǐ qù dǎ yǔmáoqiú, hǎo ma?", transQ: "이번 주말에 우리 배드민턴 치러 갈래요?", a: "太好了！我也很喜欢打羽毛球。我们星期六下午见吧！", pinyinA: "Tài hǎo le! Wǒ yě hěn xǐhuan dǎ yǔmáoqiú. Wǒmen xīngqīliù xiàwǔ jiàn ba!", transA: "너무 좋아요! 저도 배드민턴 좋아해요. 토요일 오후에 만나요!", tip: "동의 표현 '太好了' + 취미 공감 + 구체적 시간 약속으로 완성하세요." },
{ id: "s2_p3_2", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "친구 생일 선물 고민", q: "下周是我朋友的生日，送什么礼物好呢？", pinyinQ: "Xiàzhōu shì wǒ péngyou de shēngrì, sòng shénme lǐwù hǎo ne?", transQ: "다음 주가 친구 생일인데 무슨 선물을 주면 좋을까요?", a: "我觉得送香水或者手表都很不错，既实用又有意义。", pinyinA: "Wǒ juéde sòng xiāngshuǐ huòzhě shǒubiǎo dōu hěn búcuò, jì shíyòng yòu yǒu yìyì.", transA: "향수나 손목시계가 좋을 것 같아요. 실용적이면서도 의미가 있잖아요.", tip: "‘我觉得... 既实用又有意义’ 조합은 선물 추천 질문의 모범 템플릿입니다." },
{ id: "s2_p3_3", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "지하철 vs 버스 선택", q: "去市中心坐地铁快还是坐公交车快？", pinyinQ: "Qù shìzhōngxīn zuò dìtiě kuài háishì zuò gōngjiāochē kuài?", transQ: "도심에 갈 때 지하철이 빠른가요 버스가 빠른가요?", a: "当然是坐地铁快。现在是上班时间，坐公交车容易堵车。", pinyinA: "Dāngrán shì zuò dìtiě kuài. Xiànzài shì shàngbān shíjiān, zuò gōngjiāochē róngyì dǔchē.", transA: "당연히 지하철이 빠르죠. 지금 출근 시간이라 버스는 차가 막히기 쉬워요.", tip: "'当然是~'로 확답하고 이유(출근 시간 차 막힘)를 붙여줍니다." },
{ id: "s2_p3_4", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "중국 요리 추천", q: "你吃过中国菜吗？有什么好吃的推荐？", pinyinQ: "Nǐ chīguo Zhōngguó cài ma? Yǒu shénme hǎochī de tuījiàn?", transQ: "중국 요리 먹어봤어요? 맛있는 것 좀 추천해 줄래요?", a: "我常吃中国菜，我推荐你吃锅包肉和麻辣烫，味道非常棒！", pinyinA: "Wǒ cháng chī Zhōngguó cài, wǒ tuījiàn nǐ chī guōbāoròu hé málàtàng, wèidao fēicháng bàng!", transA: "자주 먹어요! 꿔바로우와 마라탕을 추천해요, 정말 맛있거든요!", tip: "꿔바로우(锅包肉), 마라탕(麻辣烫) 등 친숙한 메뉴를 활용하세요." },
{ id: "s2_p3_5", part: "part3", partName: "제3부분: 일상 대화 완성", respTime: 15, topic: "오후 비 예보", q: "外面看起来阴天了，今天下午会下雨吗？", pinyinQ: "Wàimiàn kànqilai yīntiān le, jīntiān xiàwǔ huì xiàyǔ ma?", transQ: "밖이 흐려 보이는데 오늘 오후에 비가 올까요?", a: "我看天气预报说下午有阵雨，出门最好带一把雨伞。", pinyinA: "Wǒ kàn tiānqì yùbào shuō xiàwǔ yǒu zhènyǔ, chūmén zuìhǎo dài yì bǎ yǔsǎn.", transA: "일기예보에서 소나기가 온다고 했으니 우산 하나 챙겨 나가는 게 좋겠어요.", tip: "우산 양사 '把(bǎ)'와 '最好(가장 좋다)'를 결합하세요." },
{ id: "s2_p4_1", part: "part4", partName: "제4부분: 일상 화제 및 생각 표현", respTime: 25, topic: "평소 운동 습관", q: "你平时有什么运动习惯吗？", pinyinQ: "Nǐ píngshí yǒu shénme yùndòng xíguàn ma?", transQ: "평소 어떤 운동 습관이 있나요?", a: "我平时每周去健身房运动三次。一般先跑步三十分钟，然后再做一些力量训练。坚持运动不仅可以增强体质，还能缓解工作压力。所以运动已经成了我生活的一部分。", pinyinA: "Wǒ píngshí měi zhōu qù jiànshēnfáng yùndòng sān cì. Yībān xiān pǎobù sānshí fēnzhōng, ránhòu zài zuò yìxiē lìliang xùnliàn. Jiānchí yùndòng bùjǐn kěyǐ zēngqiáng tǐzhì, hái néng huǎnjiě gōngzuò yālì. Suǒyǐ yùndòng yǐjīng chéngle wǒ shēnghuó de yí bùfen.", transA: "저는 매주 헬스장에 3번 갑니다. 보통 30분 달리고 근력 운동을 합니다. 꾸준한 운동은 체력을 기르고 업무 스트레스도 풀어줍니다. 운동은 제 삶의 일부가 되었습니다.", tip: "빈도(주 3회) + 순서(先...然后再...) + 효과(체력 증진, 스트레스 완화)로 구성합니다." },
{ id: "s2_p4_2", part: "part4", partName: "제4부분: 일상 화제 및 생각 표현", respTime: 25, topic: "좋아하는 영화 장르", q: "你最喜欢看什么类型的电影？为什么？", pinyinQ: "Nǐ zuì xǐhuan kàn shénme lèixíng de diànyǐng? Wèishénme?", transQ: "어떤 장르의 영화를 가장 좋아하며 이유는 무엇인가요?", a: "我最喜欢看动作片。因为动作片的剧情非常紧张刺激，让人看得很过瘾。而且下班后看一部精彩的动作片，可以让我彻底放松心情，忘记一天的疲劳。所以我最喜欢动作片。", pinyinA: "Wǒ zuì xǐhuan kàn dòngzuòpiàn. Yīnwèi dòngzuòpiàn de jùqíng fēicháng jǐnzhāng cìjī, ràng rén kàn de hěn guòyǐn. Érqiě xiàbān hòu kàn yí bù jīngcǎi de dòngzuòpiàn, kěyǐ ràng wǒ chèdǐ fàngsōng xīnqíng, wàngjì yì tiān de píláo. Suǒyǐ wǒ zuì xǐhuan dòngzuòpiàn.", transA: "저는 액션 영화를 가장 좋아합니다. 줄거리가 긴장감 넘치고 통쾌하기 때문입니다. 퇴근 후 멋진 액션 영화를 보면 기분도 풀리고 피로도 잊게 됩니다.", tip: "액션영화(动作片), 긴장감(紧张刺激), 피로 망각(忘记疲劳) 키워드를 쓰세요." },
{ id: "s2_p4_3", part: "part4", partName: "제4부분: 일상 화제 및 생각 표현", respTime: 25, topic: "고향 소개", q: "请介绍一下你的家乡。", pinyinQ: "Qǐng jièshào yíxià nǐ de jiāxiāng.", transQ: "고향을 간단히 소개해 주세요.", a: "我的家乡是首尔，是韩国的首都。首尔不仅交通非常便利，而且有很多著名的旅游景点，比如南山塔和明洞。首尔的美食也很多，生活非常丰富多彩。欢迎大家来我的家乡玩。", pinyinA: "Wǒ de jiāxiāng shì Shǒu'ěr, shì Hánguó de shǒudū. Shǒu'ěr bùjǐn jiāotōng fēicháng biànlì, érqiě yǒu hěn duō zhùmíng de lǚyóu jǐngdiǎn, bǐrú Nánshāntǎ hé Míngdòng. Shǒu'ěr de měishí yě hěn duō, shēnghuó fēicháng fēngfù duōcǎi. Huānyíng dàjiā lái wǒ de jiāxiāng wán.", transA: "제 고향은 서울이며 한국의 수도입니다. 교통이 편리하고 남산타워나 명동 같은 명소가 많습니다. 맛있는 음식도 많고 다채로운 도시입니다. 놀러 오시는 것을 환영합니다.", tip: "수도(首都), 편리한 교통(交通便利), 명소(南山塔, 明洞)를 나열하면 손쉽습니다." },
{ id: "s2_p5_1", part: "part5", partName: "제5부분: 논리적 의견 진술 및 비교", respTime: 50, topic: "대중교통 vs 자가용 운전", q: "平时出行，你更支持坐公共交通还是自己开车？请说明原因。", pinyinQ: "Píngshí chūxíng, nǐ gèng zhīchí zuò gōnggòng jiāotōng háishì zìjǐ kāichē? Qǐng shuōmíng yuányīn.", transQ: "평소 이동할 때 대중교통 이용과 자가용 운전 중 어느 쪽을 더 지지하나요?", a: "我更支持乘坐公共交通出行。\n第一，乘坐地铁和公交车非常环保，可以减少碳排放，对保护环境很有好处。\n第二，在上下班高峰期，坐地铁不会遇到堵车，时间更有保障，而且不用担心停车问题。\n虽然自己开车更加自由舒适，但是买车和养车的费用很高，路上还容易疲劳。\n因此，从环保和经济的角度来看，乘坐公共交通是更好的选择。", pinyinA: "Wǒ gèng zhīchí chéngzuò gōnggòng jiāotōng chūxíng.\nDì-yī, chéngzuò dìtiě hé gōngjiāochē fēicháng huánbǎo, kěyǐ jiǎnshǎo tàn páifàng, duì bǎohù huánjìng hěn yǒu hǎochù.\nDì-èr, zài shàng-xiàbān gāofēngqī, zuò dìtiě bú huì yù dào dǔchē, shíjiān gèng yǒu bǎozhàng, érqiě búyòng dānxīn tíngchē wèntí.\nSuīrán zìjǐ kāichē gèngjiā zìyóu shūshì, dànshì mǎichē hé yǎngchē de fèiyòng hěn gāo, lùshang hái róngyì píláo.\nYīncǐ, cóng huánbǎo hé jīngjì de jiǎodù lái kàn, chéngzuò gōnggòng jiāotōng shì gèng hǎo de xuǎnzé.", transA: "저는 대중교통 이용을 더 지지합니다. 첫째, 탄소 배출을 줄여 친환경적입니다. 둘째, 출퇴근 시간에 차가 막히지 않고 주차 걱정도 없습니다. 비록 운전이 편하지만 차량 유지비가 많이 듭니다. 따라서 환경과 경제적 측면에서 대중교통이 우수합니다.", tip: "친환경(环保), 주차 문제(停车问题), 경제적 관점(经济的角度)을 근거로 제시하세요." },
{ id: "s2_p5_2", part: "part5", partName: "제5부분: 논리적 의견 진술 및 비교", respTime: 50, topic: "대도시 거주 vs 한적한 시골 거주", q: "你更愿意住在繁华的大城市还是安静的乡村？为什么？", pinyinQ: "Nǐ gèng yuànyì zhù zài fánhuá de dà chéngshì háishì ānjìng de xiāngcūn? Wèishénme?", transQ: "번화한 대도시와 조용한 시골 중 어디에 살고 싶나요?", a: "我更愿意住在繁华的大城市。\n首先，大城市的基础设施非常完善，不仅交通便利，而且有优秀的医疗资源和教育环境。\n其次，大城市的工作机会和文化活动更多，生活更加丰富多彩，有利于个人的职业发展。\n虽然乡村的空气清新、环境安静，但生活设施和交通相对不太方便。\n所以综合考虑发展和生活便利性，我更喜欢住在大城市。", pinyinA: "Wǒ gèng yuànyì zhù zài fánhuá de dà chéngshì.\nShǒuxiān, dà chéngshì de jīchǔ shèshī fēicháng wánshàn, bùjǐn jiāotōng biànlì, érqiě yǒu yōuxiù de yīliáo zīyuán hé jiàoyù huánjìng.\nQícì, dà chéngshì de gōngzuò jīhuì hé wénhuà huódòng gèng duō, shēnghuó gèngjiā fēngfù duōcǎi, yǒulìyú gèrén de zhíyè fāzhǎn.\nSuīrán xiāngcūn de kōngqì qīngxīn, huánjìng ānjìng, dàn shēnghuó shèshī hé jiāotōng xiāngduì bú tài fāngbiàn.\nSuǒyǐ zōnghé kǎolǜ fāzhǎn hé shēnghuó biànlìxìng, wǒ gèng xǐhuan zhù zài dà chéngshì.", transA: "저는 번화한 대도시에 사는 것을 더 원합니다. 첫째, 인프라가 완벽해 교통, 의료, 교육 환경이 우수합니다. 둘째, 일자리와 문화생활 기회가 많아 커리어 성장에 유리합니다. 시골은 공기가 좋지만 인프라가 아쉽습니다. 편리성을 볼 때 대도시가 좋습니다.", tip: "인프라(基础设施), 의료자원(医疗资源), 커리어 발전(职业发展) 표현을 익혀두세요." }
]
};

function getPartPillStyle(p) {
  return ({part2:'bg-amber-100 text-amber-800 border border-amber-300',part3:'bg-blue-100 text-blue-800 border border-blue-300',part4:'bg-purple-100 text-purple-800 border border-purple-300',part5:'bg-rose-100 text-rose-800 border border-rose-300'})[p] || 'bg-slate-100 text-slate-800';
}
function safeCreateIcons() { try { if(window.lucide?.createIcons) window.lucide.createIcons(); } catch(e) { console.warn(e); } }
function escapeJS(v) { return String(v ?? '').split('\\').join('\\\\').split("'").join("\\'").replace(/[\r\n]/g, ' '); }
function changeSet(v) { stopTTS(); clearInterval(timerInterval); currentSet=Number(v)||1; renderApp(); }
function filterPart(p) { stopTTS(); currentPart=p; renderApp(); }
function setSpeed(v) {
  globalSpeed=v;
  document.querySelectorAll('.speed-btn').forEach(b=>{
    const active=Math.abs(Number(b.dataset.speed)-v)<.01;
    b.className=`speed-btn px-1.5 sm:px-2 py-1 text-[11px] sm:text-xs rounded ${active?'font-bold bg-blue-600 text-white shadow-sm':'font-semibold text-slate-600 hover:text-slate-900'}`;
  });
}
function playTone(f,d,type='sine') {
  try {
    webAudioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    if(webAudioCtx.state==='suspended') webAudioCtx.resume();
    const osc=webAudioCtx.createOscillator(), gain=webAudioCtx.createGain();
    osc.type=type; osc.frequency.value=f; gain.gain.setValueAtTime(.15,webAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,webAudioCtx.currentTime+d);
    osc.connect(gain); gain.connect(webAudioCtx.destination); osc.start(); osc.stop(webAudioCtx.currentTime+d);
  } catch(e) {}
}

function syncAllQuestionDetails() {
  (allTscSets[currentSet]||[]).forEach(item=>{
    const box=document.getElementById(`qDetailBox_${item.id}`); if(!box) return;
    const p=globalQPinyinVisible, k=globalKoreanVisible;
    box.querySelector('.q-pinyin')?.classList.toggle('hidden',!p);
    box.querySelector('.q-korean')?.classList.toggle('hidden',!k);
    const question=document.getElementById(`qHanzi_${item.id}`);
    const questionIsVisible=question && !question.classList.contains('hidden');
    box.classList.toggle('hidden',!(questionIsVisible&&(p||k)));
  });
}

function toggleAllQuestionText() {
  globalQ23Visible=!globalQ23Visible;
  document.getElementById('labelGlobalQ').textContent=globalQ23Visible?'2·3부 질문 숨김':'2·3부 질문 열기';
  (allTscSets[currentSet]||[]).filter(x=>x.part==='part2'||x.part==='part3').forEach(x=>{
    document.getElementById(`qHanzi_${x.id}`)?.classList.toggle('hidden',!globalQ23Visible);
    document.getElementById(`qPrompt_${x.id}`)?.classList.toggle('hidden',globalQ23Visible);
    const detail=document.getElementById(`qDetailBox_${x.id}`);
    detail?.classList.toggle('hidden',!(globalQ23Visible&&(globalQPinyinVisible||globalKoreanVisible)));
  });
}

}

function toggleAllAnswers() {
  globalAnsVisible=!globalAnsVisible;
  document.getElementById('labelGlobalAns').textContent=globalAnsVisible?'답안 전체 닫기':'답안 전체 열기';
  document.querySelectorAll('.ans-block').forEach(x=>x.classList.toggle('hidden',!globalAnsVisible));
  document.querySelectorAll('.ans-pinyin').forEach(x=>x.classList.toggle('hidden',!globalPinyinVisible));
  document.querySelectorAll('.ans-korean').forEach(x=>x.classList.toggle('hidden',!globalKoreanVisible&&!globalAnsVisible));
}

function togglePart45QuestionPinyin(id) {
  const box=document.getElementById(`qDetailBox_${id}`); if(!box) return;
  const isHidden=box.classList.contains('hidden');
  box.classList.toggle('hidden',!isHidden);
  box.querySelector('.q-pinyin')?.classList.toggle('hidden',!isHidden);
  box.querySelector('.q-korean')?.classList.toggle('hidden',!globalKoreanVisible);
}

function toggleSingleQ(id) {
  const q=document.getElementById(`qHanzi_${id}`), prompt=document.getElementById(`qPrompt_${id}`);
  if(!q) return;
  const hidden=q.classList.contains('hidden');
  q.classList.toggle('hidden',!hidden);
  prompt?.classList.toggle('hidden',hidden);
  const detail=document.getElementById(`qDetailBox_${id}`);
  detail?.classList.toggle('hidden',!(hidden&&(globalQPinyinVisible||globalKoreanVisible)));
}

function toggleSingleAns(id) {
  document.getElementById(`ansBox_${id}`)?.classList.toggle('hidden');
}

function playTTS(value,id,button) {
  if(!('speechSynthesis' in window)) {
    showToast('이 브라우저는 음성 재생을 지원하지 않습니다.');
    return;
  }
  if(window.speechSynthesis.speaking && currentSpeakingId===id) {
    stopTTS();
    return;
  }
  stopTTS();
  const cleanText = value.replace(/\(.*?\)/g, '').replace(/（.*?）/g, '').trim();
  const utter = new SpeechSynthesisUtterance(cleanText || value);
  utter.lang = 'zh-CN';
  utter.rate = globalSpeed;
  
  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => (v.lang.includes('zh') || v.lang.includes('cmn')) && v.localService) ||
                voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
  if(voice) utter.voice = voice;
  
  currentSpeakingId = id;
  if(button) button.classList.add('ring-2','ring-rose-500');
  utter.onend = utter.onerror = () => {
    currentSpeakingId = null;
    document.querySelectorAll('.tts-btn').forEach(b => b.classList.remove('ring-2','ring-rose-500'));
  };
  window.speechSynthesis.speak(utter);
}

function stopTTS() {
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  currentSpeakingId = null;
  document.querySelectorAll('.tts-btn').forEach(b => b.classList.remove('ring-2','ring-rose-500'));
}

function triggerTimer(id,duration) {
  if(timerInterval) clearInterval(timerInterval);
  if(activeTimerId) document.getElementById(`timerBox_${activeTimerId}`)?.classList.add('hidden');
  activeTimerId = id;
  const box = document.getElementById(`timerBox_${id}`),
        label = document.getElementById(`timerText_${id}`),
        bar = document.getElementById(`timerProgress_${id}`);
  if(!box||!label||!bar) return;
  box.classList.remove('hidden');
  let left = duration;
  label.textContent = `${left}초`;
  bar.style.width = '100%';
  playTone(880, 0.15);
  
  timerInterval = setInterval(() => {
    left--;
    label.textContent = left > 0 ? `${left}초` : '답변 종료!';
    bar.style.width = `${Math.max(0, (left / duration) * 100)}%`;
    if(left === 3) playTone(660, 0.12);
    if(left <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      playTone(440, 0.4, 'triangle');
      setTimeout(() => box.classList.add('hidden'), 1500);
    }
  }, 1000);
}

function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-3.5 py-2.5 rounded-lg shadow-lg z-50 transition-opacity';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

window.addEventListener('DOMContentLoaded', () => {
  renderApp();
  if('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
});
</script>
